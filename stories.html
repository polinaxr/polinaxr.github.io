      {title:'Что писали не христиане',text:'О Нём писали не только христиане. Римский историк Тацит упоминает Христа, казнённого при Пилате. Иудейский историк Иосиф Флавий пишет о брате Иисуса.\n\nРимский наместник Плиний Младший в письме императору рассказывает, что христиане поют гимны Христу как Богу.'},
      {title:'Записано при свидетелях',text:'Евангелия написаны в первые десятилетия после смерти Иисуса, когда ещё были живы свидетели. Письма апостола Павла ещё раньше, примерно через 20 лет.'},
      {title:'О чём спорят на самом деле',text:'Так что спорят не о том, жил ли Иисус. Спорят о том, кем Он был.\n\nИ этот вопрос Иисус задаёт каждому: <q>а ты за кого Меня считаешь?</q>'}
    ]},
    {slug:'kak-chitat-bibliyu',title:'Как начать читать Библию?',screens:[
      {title:'Не с первой страницы',text:'Не начинайте с первой страницы. Многие так делают, застревают на длинных списках законов и бросают.\n\nБиблию не обязательно читать подряд. Лучше всего начать с Евангелия от Марка. Оно самое короткое.'},
      {title:'Что читать дальше',text:'Потом возьмите Евангелие от Иоанна: оно глубже объясняет, кто такой Иисус. Дальше книгу Деяния, о первых христианах. А потом начало книги Бытие и Псалмы.\n\nСтарый Синодальный перевод красивый, но местами трудный. Для начала удобнее современный перевод, их много в бесплатных приложениях.'},
      {title:'Понемногу',text:'Читайте понемногу, когда есть время. Лучше прочитать немного и понять, чем много и ничего не запомнить.\n\nЗадавайте себе простые вопросы: о чём здесь говорится? Что это говорит о Боге и о человеке? И помните, что рассказ, песня и письмо читаются по-разному.'},
      {title:'Если непонятно',text:'Если что-то непонятно, это нормально. Записывайте вопросы и ищите ответы в разделе «Вопросы» и в словаре.\n\nЕщё лучше читать вместе с кем-то. И можно попросить Бога помочь понять.'}
    ]},
    {slug:'protivorechiya',title:'Есть ли в Библии противоречия?',screens:[
      {title:'Противоречий нет',text:'Нет, настоящих противоречий в Библии нет. Есть места, которые с первого взгляда кажутся противоречиями.\n\nНо если посмотреть внимательнее, всё объясняется. И ни одно такое место не касается главного: кто такой Иисус и что Он сделал.'},
      {title:'Один ангел или два',text:'Например, одно Евангелие говорит, что у пустой гробницы был один ангел, а другое — что два. Так выглядят рассказы честных свидетелей: каждый запомнил своё.\n\nЕсли бы четыре рассказа совпадали слово в слово, это было бы подозрительно. А в главном все сходятся: гробница пуста, Иисус воскрес.'},
      {title:'Разные вопросы',text:'Иногда авторы просто отвечают на разные вопросы. Павел пишет, что человека спасает вера. Иаков пишет, что вера без дел мертва.\n\nОба говорят одно: настоящая вера видна по жизни. А стихи нельзя читать как протокол. Когда в псалме горы прыгают, как овцы, это поэзия.'},
      {title:'Трудные места',text:'Есть места, о которых спорят до сих пор, и мы этого не скрываем. Обычно нам просто не хватает знаний о языке и обычаях того времени.\n\nТакие места касаются мелочей: чисел, имён, порядка событий. Главное они не меняют: <q>Иисус жил, умер и воскрес.</q>'}
    ]},
    {slug:'khoroshiy-chelovek',title:'Разве хорошего человека Бог не примет?',screens:[
      {title:'Хороших дел мало',text:'Бог принимает человека не за хорошие дела. Хороших людей много, но тех, кто ни разу не сделал зла, нет.\n\nНа фоне преступников мы выглядим неплохо. Но Бог хочет, чтобы мы любили Его и других людей всем сердцем. А так не живёт никто из нас.'},
      {title:'Добро не стирает зло',text:'Добрые дела не стирают плохие.\n\nБожий суд — не весы: хорошие дела не перевешивают плохие.'},
      {title:'Двое в храме',text:'<pr>Иисус рассказал историю о двух людях в храме. Уважаемый человек хвалился перед Богом, какой он хороший. А сборщик налогов, которого все презирали, только просил: Боже, прости меня.</pr>\n\nИисус сказал, что Бог принял второго. Иногда к Богу мешает прийти уверенность, что мне не за что просить прощения.'},
      {title:'Хорошая новость',text:'Хорошая новость: <q>Бог прощает каждого, кто доверится Иисусу.</q> Это подарок, его не нужно заслуживать. Дверь открыта всем, даже тем, кто сделал много зла.\n\nА добрые дела всё равно важны. Христианин делает добро, потому что Бог его уже принял.'}
    ]},
    {slug:'kak-molitsya',title:'Как начать молиться?',screens:[
      {title:'Разговор с Богом',text:'Молитва — это разговор с Богом. Особые слова не нужны: говорите своими словами, как с тем, кто вас любит и слышит.\n\nМолиться можно вслух или про себя, дома или в метро. Можно совсем коротко: «Боже, помоги».'},
      {title:'Молитва «Отче наш»',text:'Иисус дал ученикам пример молитвы, «Отче наш». Из неё видно, о чём можно говорить с Богом.\n\nОбращаться к Нему как к Отцу. Просить о простом, например о хлебе на сегодня. Просить прощения и самому прощать других. Просить защиты от зла.'},
      {title:'Если нет слов',text:'Бывает, что не знаешь, что сказать. Так бывает со всеми.\n\nМожно просто помолчать перед Богом. Можно прочитать псалом из Библии как свою молитву. А можно просто поблагодарить: за день, за людей рядом, за то, что Он слышит.'},
      {title:'Если Бог молчит',text:'Иногда кажется, что Бог не отвечает. Это знакомо многим верующим.\n\nНо и хороший отец не всегда даёт ребёнку то, что тот просит. Ответ бывает «да», «нет» или «подожди». <q>Молитва нужна, чтобы быть с Богом</q>, а не чтобы Им управлять.'}
    ]},
    {slug:'mnogo-tserkvey',title:'Почему так много разных церквей?',screens:[
      {title:'Три главные ветви',text:'Христиане разделились из-за споров о том, как понимать веру и как устроить церковь. Сейчас есть три главные ветви: православие, католичество и протестантизм.\n\nРазличия между ними настоящие. Но в главном большинство христиан согласны.'},
      {title:'Как это случилось',text:'В 1054 году церковь разделилась на западную, с центром в Риме, и восточную, с центром в Константинополе. Так появились католичество и православие. Для обеих главное — Библия и Предание, то есть учение церкви, которое передаётся из века в век. У католиков последнее слово за Папой Римским, у православных — за епископами, которые решают вместе.\n\nВ XVI веке Мартин Лютер и другие сказали: главное — только Библия, а прощение Бог даёт тем, кто Ему доверяет. Так появились протестанты: лютеране, баптисты, евангельские христиане и другие.'},
      {title:'Что общего',text:'Что общего у большинства христиан? Бог один: Отец, Сын и Святой Дух. Иисус — Сын Божий, Который стал человеком. Он умер за наши грехи, воскрес и вернётся.\n\nА спорят о другом: как понимать крещение и причастие, кто руководит церковью, какое место у церковных традиций.'},
      {title:'Церковь или секта',text:'Как отличить церковь от секты? Насторожитесь, если отрицают, что Иисус — Сын Божий. Если слово лидера ставят выше Библии. Если отрывают от семьи, требуют денег и запрещают задавать вопросы.\n\nПеред арестом Иисус молился, чтобы все, кто в Него поверит, были едины. <q>Христиан объединяет Сам Иисус.</q>'}
    ]},
    {slug:'raznye-religii',title:'Почему существуют разные религии?',screens:[
      {title:'Люди ищут Бога',text:'Люди во всём мире ищут Бога. Библия говорит, что Бог Сам вложил в сердце человека мысль о вечности.\n\nПоэтому христиане уважают искренний поиск. И признают, что в других религиях много правды о совести и добре.'},
      {title:'Разные ответы',text:'Часто говорят: все религии — разные тропинки на одну гору. Но на главные вопросы они отвечают по-разному.\n\nОдин Бог или много богов? Что не так с миром? Как это исправить? Кто такой Иисус: пророк, учитель или Сын Божий? Ответы часто противоположные, поэтому все сразу правы быть не могут.'},
      {title:'Бог пришёл Сам',text:'Во многих религиях человек должен сам дотянуться до Бога: правилами, усилиями, заслугами.\n\nХристианство говорит, что мы сами не дотянемся. Поэтому <q>Бог Сам пришёл к нам: Он стал человеком, Иисусом.</q> И прощение Он даёт в подарок.'},
      {title:'Можно не соглашаться и дружить',text:'Верить, что Иисус — единственный путь к Богу, не значит смотреть на других свысока. Иисус учил любить всех, даже врагов. Можно не соглашаться и при этом дружить.\n\nНе верьте нам на слово. Посмотрите на Иисуса сами.'}
    ]},
    {slug:'kto-sozdal-boga',title:'Кто создал Бога?',screens:[
      {title:'Никто',text:'Многие спрашивают: если всё создал Бог, то кто создал Бога? Христиане отвечают: никто.\n\nУ Бога нет начала. Создать можно только то, что когда-то началось. А Бог был всегда.'},
      {title:'У всего, что начинается',text:'Правило «у всего есть причина» звучит точнее так: причина есть у всего, что начинается. Дом построили, дерево выросло из семечка.\n\nУчёные говорят, что у Вселенной было начало. Значит, и у неё есть причина. А у Того, Кто не начинался, причины быть не может.'},
      {title:'Что-то есть всегда',text:'В начале всего должно стоять что-то, что существует само по себе. Атеисты обычно говорят, что это материя. Христиане верят, что это живой Бог.'},
      {title:'Неправильный вопрос',text:'Вопрос «Кто создал Бога?» к Богу не подходит: Он не начинался.\n\nБиблия с первых слов говорит о Боге как о Том, Кто уже есть. <q>Бог был до всего</q>, а всё остальное появилось благодаря Ему.'}
    ]},
    {slug:'troitsa',title:'Как Бог может быть один и при этом Отец, Сын и Святой Дух?',screens:[
      {title:'Один Бог',text:'Христиане верят: Бог один. Но Он существует как Отец, Сын и Святой Дух. Это называется Троицей.\n\nЭто не три бога. И не один Бог, Который по очереди надевает три маски. Отец, Сын и Дух существуют одновременно.'},
      {title:'Все трое в одной сцене',text:'Когда Иисус крестился в реке, Святой Дух опустился на Него, как голубь. А с неба прозвучал голос Отца: это Мой любимый Сын.\n\nВ одной сцене видны все Трое. И при этом христиане верят в одного Бога.'},
      {title:'Сравнения не подходят',text:'Троицу часто сравнивают с водой: лёд, жидкость и пар. Но вода не бывает всем этим сразу. А Отец, Сын и Дух есть всегда и говорят друг с другом.\n\nТочного примера в нашем мире нет. Бог больше всего, что Он создал.'},
      {title:'Любовь была всегда',text:'Библия говорит: Бог есть любовь. Но любить можно только кого-то. Кого Бог любил до сотворения мира?\n\nОтец всегда любил Сына, а Сын — Отца. <q>Любовь была в Боге всегда.</q> И Он зовёт нас в эту любовь.'}
    ]},
    {slug:'chemu-uchil-iisus',title:'Чему учил Иисус?',screens:[
      {title:'Две главные заповеди',text:'Иисуса однажды спросили: какая заповедь главная? Он ответил: люби Бога всем сердцем. И люби ближнего, как самого себя.\n\nВсё остальное, сказал Иисус, держится на этих двух.'},
      {title:'Слова, которые знают все',text:'Многие слова Иисуса знают даже те, кто никогда не открывал Библию. Не судите, и не будете судимы. Любите врагов ваших.\n\nИ ещё: как хотите, чтобы с вами поступали люди, так поступайте и вы с ними. Все эти слова прозвучали в Его Нагорной проповеди.'},
      {title:'Глубже правил',text:'Иисус шёл глубже обычных правил. Не только «не убивай», но и не злись на брата. Не только «не изменяй», но и не смотри с желанием на чужую жену.\n\nЧестно говоря, так не живёт никто. Иисус показал, как высока планка Бога. И что человеку нужно прощение.'},
      {title:'О Себе',text:'Иисус учил не только о жизни, но и о Себе. Он говорил: Я — путь, истина и жизнь. Он прощал людям грехи, хотя это может только Бог.\n\nПоэтому люди снова и снова спрашивали: <q>кто же Он такой?</q>'}
    ]},
    {slug:'chudesa',title:'Можно ли верить в чудеса Иисуса?',screens:[
      {title:'Можно ли в это верить',text:'Иисус исцелял больных, кормил тысячи людей пятью хлебами, ходил по воде и воскрешал мёртвых. Можно ли в это верить?\n\nХристиане отвечают: да. Если Бог создал мир и его законы, Он может и действовать в этом мире.'},
      {title:'Автор и его книга',text:'Писатель придумал законы своей книги. Но он может в любой момент вписать в неё новую главу.\n\nНаука изучает, как мир работает обычно. Но она не может доказать, что Автор мира никогда не сделает ничего необычного.'},
      {title:'Что говорят свидетели',text:'О чудесах рассказывают все четыре Евангелия. Многие чудеса видели толпы людей.\n\nДаже противники Иисуса не спорили, были ли чудеса. Они говорили, что Он творит их злой силой. Значит, о Его необычных делах знали и те, кто в Него не верил.'},
      {title:'Зачем были чудеса',text:'Иисус никогда не делал чудес напоказ. Он помогал конкретным людям: слепым, больным, голодным.\n\nЧудеса показывали, Кто Он. И каким будет мир, когда Бог всё исправит. А <q>главное чудо — воскресение</q>.'}
    ]},
    {slug:'rozhdestvo-i-pasha',title:'Что на самом деле празднуют на Рождество и на Пасху?',screens:[
      {title:'Что за праздниками',text:'Рождество и Пасху празднуют почти все. Но что за ними стоит?\n\nНа Рождество христиане празднуют рождение Иисуса. Они верят, что этот ребёнок — Бог, Который пришёл к людям.'},
      {title:'Рождество',text:'Иисус родился в городке Вифлееме. Его положили в ясли — кормушку для скота, потому что в гостинице не было места.\n\nМногие церкви празднуют Рождество 25 декабря. Русская православная церковь тоже 25 декабря, но по старому календарю. По нашему это 7 января.'},
      {title:'Пасха',text:'Иисуса распяли в пятницу. А в воскресенье утром женщины нашли Его гробницу пустой. Ангел сказал им: Он воскрес.\n\nОтсюда приветствие, которое знают почти все: «Христос воскрес!» — «Воистину воскрес!». Пасха — самый главный праздник христиан.'},
      {title:'Традиции и суть',text:'Куличи, крашеные яйца, ёлка и подарки появились позже. Многие видят в них символы, например яйцо как знак новой жизни.\n\nНо суть не в традициях. Рождество — о том, что Бог пришёл к нам. А Пасха — о том, что <q>смерть побеждена</q>.'}
    ]},
    {slug:'ne-izmenili-li-bibliyu',title:'Не изменили ли текст Библии за 2000 лет?',screens:[
      {title:'Не исказили',text:'Часто говорят: за две тысячи лет Библию сто раз переписали, значит, всё исказили. Но это не так.\n\nТекст Библии дошёл до нас очень точно. Сохранились тысячи древних рукописей, и их можно сравнить между собой.'},
      {title:'Тысячи рукописей',text:'Нового Завета на греческом сохранилось больше пяти тысяч рукописей. Самые ранние написаны всего через несколько десятков лет после оригиналов.'},
      {title:'Свитки Мёртвого моря',text:'В 1947 году пастух нашёл в пещере у Мёртвого моря древние свитки. Среди них была книга пророка Исаии, на тысячу лет старше всех известных до этого рукописей.\n\nУчёные сравнили тексты. За тысячу лет переписывания почти ничего не изменилось.'},
      {title:'Мелкие различия',text:'Да, в рукописях есть мелкие различия: как написано слово, в каком порядке стоят слова. В хороших изданиях Библии спорные места отмечены.\n\nНо ни одно учение христиан не зависит от них. <q>Бог, Иисус, крест и воскресение</q> есть во всех рукописях.'}
    ]},
    {slug:'zhestokiy-bog',title:'Почему в Ветхом Завете Бог кажется жестоким?',screens:[
      {title:'Один и тот же Бог',text:'Многие говорят: в Ветхом Завете Бог злой, а в Новом добрый. Христиане верят, что это один и тот же Бог — справедливый и милосердный.\n\nНекоторые места читать тяжело, и христиане этого не скрывают. Но стоит посмотреть внимательнее.'},
      {title:'Иона и Ниневия',text:'Сам Ветхий Завет называет Бога милосердным и долготерпеливым. Вспомните Иону, которого проглотила огромная рыба.\n\nБог послал Иону во вражеский город. Жители раскаялись, и Бог их пощадил. Иона даже обиделся, что Бог так добр к врагам.'},
      {title:'Суд над страшным злом',text:'Наказания в Ветхом Завете — почти всегда суд над страшным злом. Например, народы Ханаана приносили в жертву детей.\n\nБог ждал больше четырёхсот лет, прежде чем наказать. А тех, кто раскаивался, щадил. Те войны — события прошлого, а не приказ на все времена.'},
      {title:'Справедливость и любовь',text:'Бог не закрывает глаза на зло. Но на кресте Он Сам взял наказание на Себя. <q>Там видно и справедливость, и любовь.</q>'}
    ]},
    {slug:'posle-smerti',title:'Что будет после смерти?',screens:[
      {title:'Смерть — не конец',text:'Что будет после смерти? Это один из самых важных вопросов в жизни.\n\nХристиане верят: со смертью жизнь не заканчивается. Тело умирает, но сам человек продолжает жить и встречается с Богом.'},
      {title:'Сегодня же',text:'Рядом с Иисусом на кресте висел разбойник. Он попросил Иисуса вспомнить о нём.\n\nИисус ответил: сегодня же будешь со Мной в раю. Не через тысячу лет, а сегодня.'},
      {title:'Воскресение',text:'Но христиане верят не только в жизнь души. В конце времён Бог воскресит мёртвых. У людей будут новые тела, которые не болеют и не умирают.\n\nИисус воскрес первым и показал, как это будет. Он сказал: кто верит в Меня, даже если умрёт, оживёт.'},
      {title:'Встреча с Богом',text:'Каждый человек встретится с Богом и даст отчёт о своей жизни. Для того, кто доверился Иисусу, это не страшно: его грехи уже прощены.\n\nПоэтому христиане <q>встречают смерть с надеждой.</q>'}
    ]},
    {slug:'ad',title:'Ад существует на самом деле?',screens:[
      {title:'Ад реален',text:'Существует ли ад на самом деле? Христиане отвечают: да. Иисус говорил об аде чаще и серьёзнее, чем кто-либо в Библии.\n\nНо ад — это не подвал, где черти жарят грешников. Это картинка из народных сказок, а не из Библии.'},
      {title:'Без Бога',text:'Главный ужас ада в том, что там нет Бога. А Бог — источник всего хорошего: любви, радости, света.\n\nБез Бога не остаётся ничего хорошего. Библия описывает это образами огня и тьмы.'},
      {title:'Как это сочетается с любовью',text:'Как же любящий Бог допускает ад?\n\nБог не равнодушен ко злу. Но Он не хочет, чтобы кто-то погиб.'},
      {title:'Выход есть',text:'Иисус пришёл, чтобы люди не погибли. На кресте Он взял на Себя наказание, которое заслужили мы.\n\nКто доверяется Ему, получает прощение. <q>Бог сделал всё, чтобы спасти людей.</q>'}
    ]},
    {slug:'prostit-vsyo',title:'Может ли Бог простить мне всё, что я сделал?',screens:[
      {title:'Слишком страшно?',text:'Многие думают: то, что я сделал, Бог не простит. Слишком много, слишком страшно.\n\nНо Библия говорит: нет такого греха, который Бог не может простить человеку, который приходит к Нему.'},
      {title:'Кого простил Бог',text:'Павел преследовал христиан и одобрял их казни. Потом он стал апостолом. Пётр трижды отрёкся от Иисуса, пока не пропел петух. Иисус простил его.\n\nА разбойник на кресте ничего не успел исправить. Он только попросил о милости и получил её.'},
      {title:'Иисус шёл к «плохим»',text:'<ev>Закхей собирал налоги и обманывал людей. Иисус увидел его в толпе, позвал по имени и сам пришёл к нему в дом. После этой встречи Закхей вернул людям всё, что отнял, с лихвой.</ev>\n\nИисус обещал: <q>Того, кто приходит ко Мне, Я не прогоню.</q>'},
      {title:'Дело не в размере греха',text:'Прощение зависит не от того, насколько тяжёл грех. Оно зависит от того, что сделал Иисус. Он умер на кресте за грехи людей.\n\nЦена была огромной — жизнь Сына Божьего. Её хватит на любой грех.'},
      {title:'Непростительный грех',text:'Иисус говорил, что не простится хула на Святого Духа. Это сознательное и окончательное «нет» Богу.\n\nЕсли вы боитесь, что совершили такой грех, значит, вы его не совершали. <q>К Богу можно прийти с чем угодно.</q>'}
    ]},
    {slug:'zachem-tserkov',title:'Зачем ходить в церковь, если можно верить дома?',screens:[
      {title:'Бог у меня в душе?',text:'Многие говорят: Бог у меня в душе, зачем мне церковь? Верить, конечно, можно и дома.\n\nНо Бог задумал христиан как семью. Слово «церковь» в Библии означает собрание людей, а не здание.'},
      {title:'Одному трудно',text:'В одиночку трудно расти и держаться в тяжёлое время. Поэтому первые христиане постоянно собирались вместе.'},
      {title:'Там не идеальные люди',text:'В церкви не идеальные люди. Там бывают ошибки, обиды и лицемерие.\n\nИисус говорил: врач нужен не здоровым, а больным.'},
      {title:'Какую церковь искать',text:'Ищите общину, где объясняют Библию, в центре Иисус, а к людям относятся с любовью.\n\nИдеальной церкви не найти. <q>Но вместе с другими вера крепнет.</q>'}
    ]},
    {slug:'kreshchenie',title:'Что такое крещение и зачем оно?',screens:[
      {title:'Что это такое',text:'Крещение — это когда человека погружают в воду или обливают водой. Это знак того, что он начинает новую жизнь с Иисусом.\n\nИисус Сам велел крестить Своих учеников. И Сам крестился в реке Иордан.'},
      {title:'Что значит крещение',text:'Как вода смывает грязь, так Бог очищает человека от грехов. Человек погружается в воду и выходит из неё. Это похоже на похороны старой жизни и начало новой.\n\nА ещё в крещении человек открыто, перед всеми, становится частью церкви.'},
      {title:'Почему крестят по-разному',text:'Здесь христиане расходятся. Православные, католики и лютеране крестят и младенцев. Они верят, что в крещении действует Бог.\n\nБаптисты и многие евангельские церкви крестят тех, кто сам осознанно поверил. Мы придерживаемся второго понимания и уважаем тех, кто думает иначе.'},
      {title:'Спасает ли крещение',text:'По евангельскому пониманию, спасает вера в Иисуса, а крещение — её видимый знак. Разбойник на кресте не был крещён, но Иисус пообещал ему рай.\n\nНо крещение важно: <q>его велел Сам Иисус.</q>'}
    ]},
    {slug:'prichastie',title:'Что такое причастие?',screens:[
      {title:'Хлеб и вино',text:'Причастие — это когда христиане вместе едят хлеб и пьют вино или виноградный сок. Так они вспоминают, что Иисус умер за них.\n\nТак велел Сам Иисус на последнем ужине с учениками.'},
      {title:'Тайная вечеря',text:'Многие видели картину Леонардо да Винчи «Тайная вечеря». В тот вечер Иисус разломил хлеб и сказал, что это Его тело, которое отдаётся за учеников.\n\nПотом дал им чашу вина и сказал, что это Его кровь. И велел делать это в память о Нём.'},
      {title:'Как понимают церкви',text:'Церкви понимают причастие по-разному. Православные и католики верят, что хлеб и вино на самом деле становятся телом и кровью Христа.\n\nМногие евангельские церкви понимают хлеб и вино как знаки, а Христос присутствует через Святого Духа. Мы придерживаемся этого понимания.'},
      {title:'Для кого причастие',text:'Для всех христиан причастие — важная и святая вещь. Все едят от одного хлеба, и это показывает, что они одна семья.\n\nПричастие не для идеальных. <q>Оно для тех, кто знает, что нуждается в прощении.</q>'}
    ]},
    {slug:'somneniya',title:'Я сомневаюсь — это нормально для верующего?',screens:[
      {title:'Это нормально',text:'Нормально ли сомневаться, если ты верующий? Да. Сомневались даже ученики Иисуса, которые видели Его своими глазами.\n\nСомнение — это не конец веры. Это вопросы, с которыми можно прийти к Богу.'},
      {title:'Фома неверующий',text:'Выражение «Фома неверующий» знают почти все. Фома не поверил, что Иисус воскрес: пока сам не потрогаю раны, не поверю.\n\nИисус пришёл и предложил ему потрогать раны. Он не отругал Фому, а ответил на его сомнение. И Фома сказал: Господь мой и Бог мой!'},
      {title:'Помоги моему неверию',text:'Отец больного мальчика сказал Иисусу: верую, Господи, помоги моему неверию. Иисус помог ему.\n\nДаже маленькой веры, смешанной с сомнением, было достаточно. Тот, кто сомневается, всё ещё ищет.'},
      {title:'Что делать с сомнениями',text:'Говорите о сомнениях с Богом. Ищите ответы. Поговорите с христианином, которому доверяете.\n\nИ помните: чувства меняются, а Иисус нет. <q>Вера держится на Нём, а не на чувствах.</q>'}
    ]},
    {slug:'nauka-i-vera',title:'Наука и вера мешают друг другу?',screens:[
      {title:'Не мешают',text:'Часто говорят: наука давно опровергла Бога. Христиане с этим не согласны. Наука и вера отвечают на разные вопросы.\n\nНаука объясняет, как устроен мир. Вера отвечает, почему он вообще есть и зачем мы живём.'},
      {title:'Разные вопросы',text:'Наука и вера не спорят друг с другом. Они отвечают на разные вопросы: наука — как устроен мир, вера — Кто его создал и зачем.'},
      {title:'Верующие учёные',text:'Многие великие учёные верили в Бога. Ньютон открыл закон всемирного тяготения и много писал о Библии. Основатель генетики Мендель был монахом.\n\nА теорию Большого взрыва первым предложил Жорж Леметр. Он был священником.'},
      {title:'Об эволюции',text:'Об эволюции христиане спорят: одни понимают первые главы Библии буквально, другие нет. Но в главном согласны все.\n\nМир создал Бог, и <q>мы здесь не случайно.</q>'}
    ]},
    {slug:'hristiane-plokho',title:'Почему христиане иногда поступают плохо?',screens:[
      {title:'Христиане тоже грешат',text:'Многих отталкивает христианство из-за самих христиан. Лицемерие, крестовые походы, плохие поступки верующих.\n\nХристиане тоже грешат. Христианин — это не тот, кто стал лучше других. Это тот, кто признал, что ему нужен Бог.'},
      {title:'Иисус против лицемеров',text:'Сильнее всего Иисус ругал не грешников, а лицемеров. Он знал, что среди Его учеников будут плохие люди. Даже один из двенадцати, Иуда, предал Его.\n\nКогда христиане делают зло, они поступают против учения Иисуса.'},
      {title:'Плохой врач и медицина',text:'Войны во имя веры и казни несогласных — это зло, и его незачем оправдывать. Иисус говорил: любите врагов. Когда Пётр взял меч, Иисус велел его убрать.\n\nЕсли врач оказался плохим, мы не говорим, что медицина — обман. Учение лучше проверять по Основателю.'},
      {title:'И добро тоже',text:'Христиане основали одни из первых больниц и приютов, боролись против рабства, заботились о бедных.\n\nЦерковь — не собрание идеальных людей. Но <q>Бог меняет людей</q>, медленно и по-настоящему.'}
    ]},
    {slug:'iegovisty-i-mormony',title:'Свидетели Иеговы и мормоны — это христиане?',screens:[
      {title:'Не христианство',text:'Свидетели Иеговы и мормоны говорят об Иисусе и читают Библию. Но православные, католики и протестанты согласны: это не христианство.\n\nРазличие касается главного: кто такой Бог и кто такой Иисус.'},
      {title:'Что объединяет христиан',text:'Все христианские церкви уже больше полутора тысяч лет согласны в главном. Бог один: Отец, Сын и Святой Дух. Иисус — вечный Сын Божий, Бог, ставший человеком.\n\nЕсли группа отвергает это, она расходится с христианством в самом важном.'},
      {title:'В чём различие',text:'Свидетели Иеговы считают, что Иисус — первое творение Бога, а не Бог. У них свой перевод Библии.\n\nУ мормонов, кроме Библии, есть Книга Мормона. Они учат, что Отец, Сын и Дух — три отдельных бога, а человек может стать богом.'},
      {title:'Как относиться к людям',text:'Среди Свидетелей Иеговы и мормонов много искренних и добрых людей. Говорить о различиях нужно уважительно, без насмешек.\n\nНо различия настоящие. <q>Главный вопрос — кто такой Иисус.</q>'}
    ]},
    {slug:'pochemu-boga-ne-vidno',title:'Почему Бога не видно?',screens:[
      {title:'Не предмет нашего мира',text:'Бог — не предмет нашего мира, поэтому Его нельзя увидеть глазами, как дерево или человека. Но Он не прячется: христиане верят, что Бог Сам пришёл к людям и стал человеком — Иисусом.'},
      {title:'Бог не часть мира',text:'Бог создал мир, но не стоит в нём как ещё одна вещь. Поэтому Бога не найти в телескоп.'},
      {title:'Бог стал видимым',text:'Христиане верят, что две тысячи лет назад Бог пришёл к людям как человек. Ученики Иисуса видели Его, слышали и трогали руками.\n\nОдин из учеников попросил: покажи нам Бога. Иисус ответил: кто видел Меня, видел и Отца.'},
      {title:'Почему не в полной силе',text:'Если бы Бог явился во всей силе, никто не смог бы с Ним спорить. Но Бог хочет не покорности от страха, а доверия и любви. Любовь силой не получишь.\n\nМногие видели чудеса Иисуса и всё равно не поверили. Значит, дело не только в том, чтобы увидеть.'},
      {title:'Как узнать Бога',text:'Через Библию, через молитву, через людей, которых Он изменил.'}
    ]},
    {slug:'bog-muzhchina',title:'Бог мужчина или женщина?',screens:[
      {title:'Ни то, ни другое',text:'Ни то, ни другое. Бог — не человек, у Него нет тела и пола. Библия называет Его Отцом не потому, что Он мужчина, а чтобы показать, как Он относится к нам.'},
      {title:'Бог есть Дух',text:'Мужчина и женщина — это то, какими Бог создал людей. Сам Бог — Творец, а не часть творения. Библия говорит, что Бог есть Дух.\n\nБог создал человека по Своему образу — и мужчину, и женщину. Значит, оба одинаково отражают что-то от Бога.'},
      {title:'Почему Отец',text:'Так Бога называл Иисус, и так Он научил молиться: «Отче наш». Слово «Отец» говорит о заботе, защите и близости. Бог не далёкая сила, а Тот, Кто любит, как родитель.\n\nХристиане говорят о Боге «Он» по примеру Библии. Это не значит, что женщины Богу дальше или дороже Ему меньше.'},
      {title:'Как мать',text:'Бог говорит, что утешит людей, как мать утешает ребёнка. Иисус сравнил Себя с птицей, которая собирает птенцов под крылья.\n\n<q>Все эти образы говорят об одном: Бог любит нас глубже и вернее, чем самые лучшие родители.</q>'}
    ]},
    {slug:'bog-nakazhet',title:'Бог меня накажет?',screens:[
      {title:'Бог не ищет, за что наказать',text:'Бог справедлив и не закрывает глаза на зло. Но Он не ищет, за что наказать. Он любит человека и хочет его простить.'},
      {title:'Божий гнев другой',text:'Мы злимся, когда нас задели или когда мы устали. Божий гнев другой: это твёрдое «нет» злу, которое губит людей.\n\nБог против зла, потому что любит нас.'},
      {title:'Потерянная овца',text:'<pr>Иисус рассказал о пастухе, у которого из ста овец потерялась одна. Пастух оставил остальных и искал, пока не нашёл. А потом нёс её домой на плечах и радовался.</pr>\n\nТак Иисус объяснил, как Бог относится к человеку, который от Него ушёл.'},
      {title:'Наказание понёс Иисус',text:'Иисус умер на кресте и принял на Себя наказание за наши грехи.\n\n<q>Кто доверился Иисусу, тот больше не стоит перед Богом как обвиняемый.</q>'},
      {title:'Беда — не всегда наказание',text:'Ученики увидели человека, слепого от рождения, и спросили Иисуса: кто согрешил, он или его родители? Иисус ответил: ни он, ни родители. А потом исцелил его.'}
    ]},
    {slug:'zachem-sozdal-mir',title:'Зачем Бог создал мир?',screens:[
      {title:'Из любви',text:'Не потому, что Ему чего-то не хватало. Богу не было ни одиноко, ни скучно. Он создал мир из любви: чтобы поделиться жизнью и радостью.'},
      {title:'Богу не было одиноко',text:'Иногда думают: Бог создал людей, потому что Ему было одиноко. Но христиане верят, что в Боге всегда была любовь. Отец, Сын и Святой Дух любили друг друга ещё до сотворения мира.\n\nЗначит, мир — не способ заполнить пустоту.'},
      {title:'Мир — подарок',text:'Бог создал мир из любви: чтобы подарить жизнь и любить.\n\nВ начале Библии Бог смотрит на всё, что создал, и видит: всё очень хорошо.'},
      {title:'Для чего мы устроены',text:'Человек создан, чтобы знать Бога, любить Его и заботиться о мире. Это не тяжёлая обязанность, а то, для чего мы устроены.\n\n<q>Человек по-настоящему живёт рядом с Богом.</q>'}
    ]},
    {slug:'svoboda-i-sudba',title:'Если Бог всё знает заранее, есть ли у меня свобода?',screens:[
      {title:'Свобода есть',text:'Да, свобода есть. Бог знает будущее, но это не значит, что Он нас заставляет. Наши решения настоящие, и мы за них отвечаем.'},
      {title:'Мама и мороженое',text:'Мама хорошо знает своего ребёнка и может сказать заранее: он выберет мороженое, а не суп. Но выбирает всё-таки ребёнок.\n\nБог знает гораздо больше любой мамы. Он видит всю нашу жизнь сразу. Но от этого наш выбор не становится ненастоящим.'},
      {title:'Бог правит и зовёт',text:'Бог управляет историей, и ничто не выходит из-под Его власти. И при этом Бог снова и снова зовёт людей: выберите жизнь, вернитесь ко Мне.\n\nКак именно одно сочетается с другим, мы до конца не понимаем. Христиане разных церквей объясняют это по-разному. Но все согласны: Бог не играет людьми, как куклами.'},
      {title:'Не рок, а Бог',text:'Христианство не верит в рок, который всё решил за нас. За миром стоит не безличная судьба, а Бог, Который нас любит.\n\nПоэтому можно спокойно принимать решения и молиться о них.<q>А ошибки не ставят крест на жизни: Бог умеет исправлять и их.</q>'}
    ]},
    {slug:'kak-vyglyadel',title:'Как выглядел Иисус?',screens:[
      {title:'Точно не знаем',text:'Точно мы не знаем: Евангелия не описывают Его внешность. Скорее всего, Он был похож на обычного еврея своего времени: смуглый, темноволосый, с руками рабочего человека.'},
      {title:'Евангелия молчат',text:'Авторы Евангелий подробно пишут, что Иисус говорил и делал, но не пишут, какого Он был роста и какого цвета у Него глаза. Им было важнее, Кто Он.'},
      {title:'Каждый рисует по-своему',text:'Художники разных стран рисовали Иисуса похожим на своих. В Европе Он светлый, в Эфиопии темнокожий, в Китае — с восточными чертами.\n\nЗнаменитые картины и иконы — это не портреты. Это попытка показать, Кем Иисус был для людей.'},
      {title:'Туринская плащаница',text:'Некоторые считают, что на этой древней ткани отпечаталось тело Иисуса. Учёные спорят о ней до сих пор. Христианская вера от этого спора не зависит.'},
      {title:'Не за красоту',text:'Задолго до Иисуса пророк писал, что в Нём не будет ничего броского.<q>Люди шли к Нему не за красотой, а потому, что Он любил, исцелял и говорил правду.</q>'}
    ]},
    {slug:'devstvennoe-rozhdenie',title:'Правда ли Иисус родился от девы?',screens:[
      {title:'Да, это чудо',text:'Да, христиане верят, что Мария родила Иисуса, не зная мужа. Это чудо. Так Бог показал, что Иисус — не просто ещё один человек, а Сын Божий, пришедший в мир.'},
      {title:'Что рассказывают Евангелия',text:'Два Евангелия, от Матфея и от Луки, рассказывают: ангел пришёл к молодой девушке Марии и сказал, что она родит Сына от Святого Духа. Мария удивилась: как это будет, если у меня нет мужа?\n\nЕё жених Иосиф сначала хотел тихо расторгнуть помолвку. Ему тоже пришлось поверить.'},
      {title:'Люди знали, откуда дети',text:'Люди древности прекрасно знали, откуда берутся дети. Поэтому Иосиф и встревожился. Евангелисты понимали, насколько это необычно.\n\nНо если Бог создал саму жизнь, Ему не трудно начать одну жизнь по-особому.'},
      {title:'Знак того, Кто Он',text:'Иисус — не человек, который со временем стал Богом. Бог Сам пришёл в мир и стал человеком. Необычное рождение — знак этого.\n\nИногда это путают с «непорочным зачатием». У католиков так называется учение о том, что Сама Мария была зачата без греха. Протестанты и православные так не учат.<q>А в рождение Иисуса от девы верят все христиане.</q>'}
    ]},
    {slug:'vydumka-voskreseniya',title:'Может, воскресение Иисуса — выдумка учеников?',screens:[
      {title:'Нет',text:'Нет. Ученики были готовы умереть за то, что видели живого Иисуса. За выдумку, которую сам сочинил, так не умирают.'},
      {title:'Пустая могила',text:'Иисуса казнили и похоронили. Через несколько дней Его могила оказалась пустой. Ученики были уверены, что видели Его живым.\n\nИ вера в воскресение быстро распространилась прямо в Иерусалиме, где каждый мог проверить.'},
      {title:'За ложь не умирают',text:'После казни ученики прятались от страха. А потом вдруг стали бесстрашно говорить о воскресении и шли за это в тюрьму и на смерть. Умирают за ложь, в которую верят. Но никто не умирает за ложь, которую сам придумал.\n\nИ если бы ученики сочиняли, вряд ли первыми свидетелями сделали бы женщин: их слову в то время в суде не верили.'},
      {title:'Не галлюцинация',text:'Галлюцинация бывает у одного человека, а не у многих сразу. Павел пишет, что Иисус однажды явился больше чем пятистам людям, и многие из них ещё живы — можно расспросить.\n\nА главное, видение не объясняет пустую могилу. Власти легко остановили бы слухи, показав тело.<q>Но тела не было.</q>'}
    ]},
    {slug:'vtoroe-prishestvie',title:'Иисус правда вернётся?',screens:[
      {title:'Да, вернётся',text:'Да. Иисус обещал вернуться, и христиане всех церквей в это верят. Когда это будет, не знает никто, поэтому все предсказания точных дат — ошибка.'},
      {title:'Что обещал Иисус',text:'Иисус обещал ученикам, что вернётся. А когда Он вознёсся на небо, ангелы сказали им: Он придёт снова. Тогда Он будет судить мир, воскресит умерших и исправит всё сломанное.\n\nВ это верят и православные, и католики, и протестанты.'},
      {title:'Даты не знает никто',text:'Иисус сказал прямо: о том дне и часе не знает никто. Поэтому, когда кто-то объявляет конец света на конкретное число, это не от Бога.\n\nТаких предсказаний было очень много. Ни одно не сбылось.'},
      {title:'Как ждать',text:'Без страха и паники. Иисус сравнил это с хозяином, который уехал и может вернуться в любой момент. Хороший слуга не трясётся, а просто живёт так, чтобы не было стыдно.\n\n<q>Для христиан это добрая новость: зло и боль не навсегда.</q>'}
    ]},
    {slug:'vethiy-i-novyy',title:'Чем Ветхий Завет отличается от Нового?',screens:[
      {title:'Две части Библии',text:'Ветхий Завет — это книги, написанные до Иисуса: о сотворении мира, о народе Израиля и об обещании Спасителя. Новый Завет — книги об Иисусе и первых христианах. Для христиан это одна история: в первой части Бог обещает, во второй исполняет.'},
      {title:'Ветхий Завет',text:'Это большая часть Библии. В ней рассказ о сотворении мира, истории Авраама, Моисея, царя Давида, песни-молитвы псалмов и слова пророков.\n\nЧерез всё это проходит одна мысль: Бог не оставил людей и пошлёт Того, Кто всё исправит.'},
      {title:'Новый Завет',text:'Это 27 книг. Четыре Евангелия рассказывают о жизни Иисуса, книга Деяний — о первых христианах, а письма апостолов объясняют, как жить с верой.\n\nПоследняя книга, Откровение, говорит о том, чем закончится история мира.'},
      {title:'Что значит «завет»',text:'Завет — это союз, договор между Богом и людьми. Старый союз Бог заключил с народом Израиля через Моисея. Новый — со всеми людьми через Иисуса.'},
      {title:'Почему нужны обе',text:'Без Ветхого Завета непонятно, Кого ждали и зачем пришёл Иисус. Без Нового — чем закончилось обещание.<q>Сам Иисус постоянно ссылался на Ветхий Завет и говорил, что он рассказывает о Нём.</q>'}
    ]},
    {slug:'kanon',title:'Почему в Библии именно эти книги?',screens:[
      {title:'Не голосованием',text:'Книги не выбирали голосованием по вкусу. Церковь признала те книги, которые с самого начала читали как Слово Божье: написанные пророками, апостолами и их ближайшими учениками.'},
      {title:'Как отбирали книги',text:'Уже в первые десятилетия христиане читали на собраниях Евангелия и письма апостолов. Главный вопрос был простой: написано ли это апостолом или тем, кто знал апостолов?\n\nК IV веку список из 27 книг был общепринятым. Церковь не придумала его, а подтвердила то, что давно читали по всему миру.'},
      {title:'Ветхий Завет',text:'Ветхий Завет христиане приняли от иудеев. Иисус и апостолы читали эти книги как слово Бога.\n\nЗдесь есть различие между церквями. В православной и католической Библии есть ещё несколько книг, написанных незадолго до Иисуса. Протестанты не включают их в Библию, хотя считают полезными для чтения.'},
      {title:'Потерянные евангелия',text:'Многие тексты, которые иногда называют «потерянными евангелиями», написаны через сто и больше лет после Иисуса.<q>Их авторы не знали Его и часто учили совсем другому.</q>'}
    ]},
    {slug:'bukvalno',title:'Нужно ли понимать Библию буквально?',screens:[
      {title:'Как задумали авторы',text:'Библию нужно понимать так, как её задумали авторы. Где рассказывают о событиях — это события. Где притча или поэзия — это притча или поэзия. Христиане верят, что всё это правда, но правда бывает рассказана по-разному.'},
      {title:'Целая библиотека',text:'Библия — целая библиотека. В ней есть история, законы, песни, пословицы, письма, притчи и видения.\n\nМы же не читаем басню Крылова как отчёт о говорящей вороне. Но и не считаем, что в ней нет правды.'},
      {title:'Притча — это притча',text:'Когда Иисус рассказывает о сеятеле, разбрасывающем семена, Он не описывает конкретного крестьянина. Это притча, и Он Сам её объясняет.\n\nКогда Иисус говорит: Я дверь, Он не имеет в виду, что сделан из дерева. Это образ: через Него входят к Богу.'},
      {title:'События — это события',text:'Рождение Иисуса, Его казнь и воскресение Евангелия описывают как реальные события, с именами, местами и свидетелями. Апостол Павел писал: если Христос не воскрес, наша вера пуста.\n\nЕсть места, о которых христиане спорят: например, как понимать шесть дней творения.<q>Но в главном все согласны.</q>'}
    ]},
    {slug:'perevody',title:'Какой перевод Библии выбрать?',screens:[
      {title:'Начните с понятного',text:'Для первого чтения лучше взять современный перевод: он написан понятным языком. Синодальный перевод красивый и самый известный, но многие слова в нём устарели.'},
      {title:'Синодальный перевод',text:'Это самый распространённый русский перевод, ему около 150 лет. Его читают и православные, и протестанты. Он точный и торжественный.\n\nНо язык XIX века местами труден: «дабы», «доколе», «ланиты». Новичку бывает сложно понять смысл.'},
      {title:'Современные переводы',text:'Есть переводы на обычный современный язык. Например, «Современный русский перевод» Российского библейского общества и «Новый русский перевод».\n\nИх делали знатоки древних языков. Читать их легче, а смысл тот же.'},
      {title:'Что выбрать',text:'Начните с современного перевода, чтобы понять смысл. А когда захочется сравнить, откройте Синодальный: его выражения встречаются в книгах, песнях и в речи.\n\n<q>Многие приложения для телефона позволяют читать несколько переводов рядом.</q>'}
    ]},
    {slug:'prorochestva',title:'Сбылись ли пророчества Библии?',screens:[
      {title:'Да, сбылись',text:'Христиане верят, что да. Задолго до Иисуса пророки сказали, где Он родится, как будет страдать и что Его смерть будет за других. Всё это совпало с жизнью Иисуса.'},
      {title:'Кто такой пророк',text:'Пророк в Библии — это не гадалка. Это человек, через которого Бог говорил людям. Чаще всего пророки обличали зло и звали вернуться к Богу.\n\nНо иногда они говорили и о будущем, особенно о Том, Кого пошлёт Бог.'},
      {title:'Что предсказали',text:'Пророк Михей сказал, что Спаситель родится в маленьком Вифлееме. Пророк Исаия писал о Слуге Божьем, Которого будут презирать, Который будет страдать за чужие грехи и будет похоронен с богатым.\n\nВ одном из псалмов описано, как над страдающим смеются, делят его одежду и бросают о ней жребий. Всё это было при казни Иисуса.'},
      {title:'Это нельзя подстроить',text:'Многое человек подстроить не может: где родиться, как тебя казнят, что сделают солдаты у креста.\n\nА древние рукописи с этими текстами, найденные у Мёртвого моря, написаны ещё до рождения Иисуса.<q>Значит, тексты не дописали задним числом.</q>'}
    ]},
    {slug:'sovest',title:'Откуда у нас совесть?',screens:[
      {title:'Голос внутри',text:'Христиане верят, что совесть вложил в человека Бог. Это внутренний голос, который подсказывает, что хорошо, а что плохо. Он есть у всех людей, даже у тех, кто не верит в Бога.'},
      {title:'Закон в сердце',text:'Апостол Павел писал, что Божий закон написан у людей в сердцах. Поэтому даже те, кто никогда не читал Библию, знают, что нельзя предавать друга и мучить слабого.\n\nВо всех культурах люди чувствуют стыд и вину. Это след того, что мы созданы Богом.'},
      {title:'Совесть можно заглушить',text:'Человек, который привык ко злу, может почти не чувствовать вины.\n\nА бывает наоборот: совесть мучает за то, в чём человек не виноват. Её тоже нужно сверять с Богом.'},
      {title:'Совесть не снимает вину',text:'Совесть говорит: ты виноват. Но она не может снять вину. Это может только прощение.\n\nХристиане верят: Бог прощает каждого, кто приходит к Нему через Иисуса.<q>После этого совесть может успокоиться не потому, что вину забыли, а потому, что её простили.</q>'}
    ]},
    {slug:'prostit-drugih',title:'Как простить того, кто причинил мне боль?',screens:[
      {title:'Что значит простить',text:'Простить — значит отказаться от мести и передать суд Богу. Это не значит сказать, что зло было нормальным, и не значит снова довериться тому, кто опасен. Часто прощение — не один момент, а путь.'},
      {title:'Что прощение не значит',text:'Простить не значит забыть или сделать вид, что ничего не было. Зло остаётся злом.\n\nПрощение не требует оставаться рядом с тем, кто продолжает причинять вред. Можно простить и при этом защитить себя.'},
      {title:'Как Бог простил нас',text:'В молитве «Отче наш» есть слова: прости нам наши долги, как и мы прощаем нашим должникам. Бог простил нам огромный долг. Поэтому и нас Он зовёт прощать.\n\nИисус, когда Его прибивали к кресту, молился о палачах: Отче, прости им, они не знают, что делают.'},
      {title:'Если не получается',text:'Простить сразу бывает невозможно, особенно если рана глубокая. Можно начать с честной молитвы: Боже, я не могу простить, помоги мне захотеть.\n\n<q>Прощение освобождает в первую очередь того, кто прощает.</q>'}
    ]},
    {slug:'samoubiystvo',title:'Самоубийство — это грех, который нельзя простить?',screens:[
      {title:'Нет такого правила',text:'Нет, в Библии нет такого правила. Спасает человека Иисус, а не то, как закончилась его жизнь. Но жизнь — дар Бога, и Бог очень не хочет, чтобы кто-то её обрывал.'},
      {title:'Если вам сейчас плохо',text:'Ваша боль настоящая, и Бог её видит. Но мысль, что выхода нет, — неправда, которую подсказывает боль. Сейчас главное не оставаться одному: скажите кому-нибудь, что вам плохо, позвоните на линию помощи.\n\nВ Библии есть люди, которые просили Бога забрать их жизнь: пророк Илия, Иов. Бог не осудил их. Илии Он дал отдых и еду, а с Иовом говорил Сам.'},
      {title:'Судит только Бог',text:'Самоубийство часто связано с болезнью, депрессией, невыносимой болью. Судить человека может только Бог, а Он знает всё, что было у него на сердце.\n\nХристиане верят: кто доверился Иисусу, того ничто не может оторвать от Божьей любви, даже смерть. Вашей вины в этом может не быть, даже если кажется иначе.\n\n<q>Все христиане согласны: жизнь — дар Бога, и Он хочет, чтобы мы её берегли.</q>'},
    ]},
    {slug:'smertnye-grehi',title:'Что такое семь смертных грехов?',screens:[
      {title:'Список из традиции',text:'Это список из церковной традиции, а не из Библии: гордыня, жадность, зависть, гнев, блуд, чревоугодие и уныние. Его составили древние монахи, чтобы показать корни других грехов.'},
      {title:'Откуда он взялся',text:'Ещё в IV–VI веках монахи заметили, что многие плохие поступки растут из нескольких корней. Например, кража — из жадности, ссоры — из гордости и гнева.\n\nТак появился список главных страстей. В православной традиции их обычно восемь, в католической — семь.'},
      {title:'Мелких грехов нет',text:'Иногда кажется: есть страшные грехи, а есть мелкие, на которые можно не обращать внимания. Библия говорит строже: любой грех отделяет человека от Бога.\n\nИисус сказал, что даже злоба в сердце сродни убийству. Так что грешны все, а не только убийцы.'},
      {title:'Простить можно всё',text:'Нет греха, который Бог не может простить тому, кто приходит к Нему. Иисус умер за все грехи, и «смертные», и «мелкие».\n\nЭтот список полезен, чтобы честно посмотреть на себя.<q>Но не чтобы бояться.</q>'}
    ]},
    {slug:'pochemu-delayu-zlo',title:'Почему я делаю плохое, даже когда не хочу?',screens:[
      {title:'Сила внутри нас',text:'Потому что грех — не только плохие поступки, но и сила внутри нас, которая тянет не туда. Это знакомо даже великим святым. Изменить это одной силой воли не получается, но Бог меняет человека изнутри.'},
      {title:'Павел о себе',text:'<bq>Апостол Павел, один из самых известных христиан, писал о себе: я не делаю добро, которое хочу, а делаю зло, которого не хочу.</bq>\n\nТо есть желать хорошего мало. Внутри что-то сломано, и это есть у каждого.'},
      {title:'Корень в сердце',text:'Можно на время сдержаться. Но корень — в сердце: в гордости, обиде, страхе, в желании жить только для себя.'},
      {title:'Бог меняет изнутри',text:'Когда человек доверяется Иисусу, Бог прощает его и даёт ему Святого Духа. Дух меняет желания изнутри, постепенно, иногда медленно.\n\nХристиане тоже срываются. Но каждый раз можно вернуться к Богу, попросить прощения и начать снова.<q>Бог не устаёт прощать.</q>'}
    ]},
    {slug:'dyavol',title:'Дьявол существует на самом деле?',screens:[
      {title:'Да, существует',text:'Да, христиане верят, что дьявол реален. Но он не второй бог и не равен Богу. Это ангел, который восстал против Бога. Иисус уже победил его, поэтому бояться его тем, кто с Богом, не нужно.'},
      {title:'Личность, а не символ',text:'Библия описывает дьявола как личность, а не просто как символ зла. Его называют сатаной, то есть противником, и отцом лжи.\n\nОн не создатель зла. Бог создал всех ангелов хорошими, но один из них из гордости восстал против Бога и увлёк других.'},
      {title:'Его оружие — ложь',text:'Его главное оружие — ложь. Он нашёптывает, что Бог нас не любит, что грех безвреден, что прощения нет.\n\nОн не всемогущ, не всезнающ и не вездесущ. Он лишь творение и не может сделать больше, чем позволит Бог.'},
      {title:'Иисус победил',text:'Иисус изгонял злых духов одним словом. На кресте Он лишил дьявола главной силы — права обвинять нас.\n\nПоэтому христиане не ищут бесов за каждым углом и не забывают о собственной ответственности.<q>Но и не играют с оккультизмом: Библия советует держаться подальше от гаданий, спиритизма и заговоров.</q>'}
    ]},
    {slug:'ot-chego-spasenie',title:'От чего нас спасает Бог?',screens:[
      {title:'От чего и для чего',text:'От греха и того, к чему он ведёт: от вины, от разрыва с Богом и от смерти без надежды. А ещё Бог спасает не только «от», но и «для»: для жизни с Ним, которая начинается уже сейчас.'},
      {title:'То, что не исправить самому',text:'Человек может быть здоров, успешен и доволен. Но внутри у каждого есть то, что мы делали не так, и то, чего не исправить самому.\n\nБиблия говорит, что грех отделяет нас от Бога, как стена. А без Бога у жизни нет прочной опоры, а у смерти — надежды.'},
      {title:'Кому нужна помощь',text:'Иисус говорил о Себе: Я пришёл не к здоровым, а к больным. Его помощь нужна тем, кто честно видит, что сам не справится.'},
      {title:'Новая жизнь',text:'Бог прощает вину и убирает стену между нами и Им. Человек получает новую жизнь, мир с Богом и надежду на вечную жизнь.\n\nЭто не только про «после смерти».<q>Жизнь с Богом меняет человека уже здесь.</q>'}
    ]},
    {slug:'ne-slyshal',title:'Что будет с теми, кто никогда не слышал об Иисусе?',screens:[
      {title:'Бог справедлив',text:'Мы точно знаем главное: Бог справедлив и милостив, и никто не будет осуждён несправедливо. Как именно Бог поступит с каждым, решает Он Сам, и Он знает сердце каждого человека.'},
      {title:'Через мир и совесть',text:'Библия говорит, что Бога можно узнать через мир, который Он создал: небо, природу, жизнь. И у каждого человека есть совесть.\n\nПоэтому даже тот, кто не слышал об Иисусе, не совсем без света.'},
      {title:'Бог судит по правде',text:'Бог не спросит с человека того, чего тот не мог знать. Он судит по правде, а не по формальностям.\n\nВ Библии есть люди, которые не принадлежали к народу Израиля, но искали Бога, и Бог их принял: например, Мелхиседек и праведник Иов.'},
      {title:'Честно о том, чего не знаем',text:'Одни христиане верят, что Бог может спасти таких людей ради Иисуса, даже если они не знали Его имени. Другие осторожнее. Библия не отвечает на этот вопрос во всех подробностях.\n\nНо одно ясно: поэтому христиане и рассказывают об Иисусе всему миру.<q>А тому, кто уже услышал, важно ответить на вопрос о Нём самому.</q>'}
    ]},
    {slug:'deti-umershie',title:'Что будет с детьми, которые умерли маленькими?',screens:[
      {title:'В руках Бога',text:'Христиане верят, что маленькие дети в руках доброго и милосердного Бога. Иисус особенно любил детей. Библия не описывает всё подробно, но даёт твёрдую надежду.'},
      {title:'Пустите детей',text:'<ev>Когда ученики не пускали детей к Иисусу, Он рассердился и сказал: пустите детей ко Мне, таким принадлежит Царство Божье. А потом обнимал их и благословлял.</ev>\n\nБог, Который так любит детей, не оставит их.'},
      {title:'Давид и его сын',text:'У царя Давида умер новорождённый сын. Давид сказал: я пойду к нему, а он ко мне не вернётся. Он верил, что снова встретит ребёнка.\n\nМногие христиане видят в этом надежду и для своих детей.'},
      {title:'Если это ваша боль',text:'Боль от такой утраты огромна, и её не нужно прятать. Иисус плакал у могилы друга. Бог не равнодушен к вашей боли.\n\nВы не виноваты в том, что ребёнок не успел креститься или узнать о Боге.<q>Ребёнок в руках Того, Кто любит его ещё сильнее, чем вы.</q>'}
    ]},
    {slug:'razboynik',title:'Можно ли прийти к Богу перед самой смертью?',screens:[
      {title:'Пока жив — не поздно',text:'Да. Пока человек жив, не поздно. Рядом с Иисусом на кресте умирал разбойник, и Иисус пообещал ему рай. Но откладывать опасно: никто не знает, сколько у него времени.'},
      {title:'Разбойник на кресте',text:'Вместе с Иисусом казнили двух преступников. Один насмехался. А другой сказал: мы наказаны справедливо, а Он ничего плохого не сделал. И попросил: Иисус, вспомни меня, когда придёшь в Своё Царство.\n\nИисус ответил: сегодня же будешь со Мной в раю. У этого человека не было ни добрых дел, ни времени их сделать. Только доверие.'},
      {title:'Работники последнего часа',text:'<pr>Иисус рассказал притчу о работниках, которых наняли в последний час дня. Хозяин заплатил им так же щедро, как и тем, кто работал с утра.</pr>\n\nБожья любовь — не зарплата за стаж.'},
      {title:'Почему не откладывать',text:'Мы не знаем, будет ли у нас последний час и сможем ли мы тогда думать ясно. А главное, жизнь с Богом — это не только билет в рай.<q>Это лучшее, что может быть уже сейчас.</q>'}
    ]},
    {slug:'uverennost',title:'Как понять, что Бог меня простил?',screens:[
      {title:'Не по чувствам',text:'Не по чувствам, а по Божьему обещанию. Бог обещал: кто доверяется Иисусу, тот прощён. Чувства приходят и уходят, а слово Бога остаётся.'},
      {title:'Чувства меняются',text:'Сегодня радостно, завтра тоскливо. Если судить о прощении по настроению, уверенности не будет никогда.\n\n<q>Прощение держится на обещании Бога, а не на чувствах.</q>'},
      {title:'Божье обещание',text:'Библия говорит: если мы признаём свои грехи, Бог, верный и справедливый, простит нас и очистит от всякого зла. И ещё: тех, кто доверился Иисусу, Бог больше не осуждает.\n\nПрощение держится на том, что сделал Иисус, а не на том, насколько сильно мы раскаялись.'},
      {title:'Перемены внутри',text:'Постепенно человек замечает перемены: ему хочется говорить с Богом, ему больно от своего зла, он начинает любить людей, которых раньше не выносил.\n\nЭто не условие прощения, а его плод.<q>Сомнения при этом бывают у всех, и это не значит, что Бог передумал.</q>'}
    ]},
    {slug:'vera-besov',title:'Разве недостаточно просто верить, что Бог есть?',screens:[
      {title:'Этого мало',text:'Нет, этого мало. Библия замечает: даже бесы верят, что Бог есть, и трепещут. Христианская вера — это не только согласие, что Бог существует, а доверие Ему.'},
      {title:'Знать и доверять — разное',text:'Вера в Библии — это когда опираешься на Бога всей жизнью, а не только соглашаешься с Ним в голове.'},
      {title:'Вера — это доверие',text:'Христианская вера — это доверие Иисусу: что Он умер за мои грехи и воскрес, и что Его прощение мне нужно.'},
      {title:'Вера меняет поступки',text:'Апостол Иаков писал, что вера без дел мертва. Не потому, что дела спасают, а потому, что настоящее доверие меняет поступки.\n\n<q>Если человек правда поверил, что дом горит, он не будет спокойно пить чай.</q>'}
    ]},
    {slug:'svyatoy-duh',title:'Кто такой Святой Дух?',screens:[
      {title:'Бог, а не сила',text:'Святой Дух — это Бог, а не безличная сила или энергия. Христиане верят, что Он живёт в каждом, кто доверился Иисусу: утешает, учит и постепенно меняет человека изнутри.'},
      {title:'Часть Троицы',text:'Христиане верят в одного Бога: Отца, Сына и Святого Духа. Святой Дух не меньше Отца и Сына. Это Троица.\n\nЕго можно огорчить, Он говорит и учит. Это черты личности, а не силы вроде электричества.'},
      {title:'Обещание Иисуса',text:'Перед смертью Иисус сказал ученикам: Я не оставлю вас сиротами. Отец пошлёт вам Святого Духа, Который будет с вами всегда.\n\nЧерез пятьдесят дней после воскресения Святой Дух сошёл на учеников. Христиане вспоминают это в праздник Троицы, или Пятидесятницы.'},
      {title:'Что Он делает',text:'Помогает понять Библию. Даёт силы, когда своих не хватает. Напоминает, что мы Божьи дети. И растит в человеке любовь, радость, мир, терпение и доброту.\n\n<q>Это происходит не мгновенно, а как рост дерева: незаметно день за днём, но заметно за годы.</q>'}
    ]},
    {slug:'posty',title:'Нужно ли христианину соблюдать посты?',screens:[
      {title:'Что такое пост',text:'Пост — добровольный отказ от еды или чего-то привычного ради того, чтобы больше времени отдать Богу. Иисус постился и говорил о посте. Но спасает не пост, а Бог.'},
      {title:'Зачем постятся',text:'Цель поста не похудеть и не заслужить Божью любовь. Пост помогает увидеть, что Бог важнее даже хлеба. Вместо еды — молитва.\n\nИисус постился сорок дней в пустыне прежде чем начал учить людей.'},
      {title:'Не напоказ',text:'Иисус предупреждал: не поститесь напоказ, с печальным лицом, чтобы все видели. Пусть об этом знает Бог.\n\nА пророк Исаия писал, что Богу дороже другой пост: накормить голодного, помочь бедному, освободить угнетённого.'},
      {title:'Как в разных церквях',text:'В православной церкви есть календарь постов: Великий пост перед Пасхой, пост перед Рождеством и другие. Протестанты обычно постятся по собственному решению или вместе с церковью в особое время.\n\nЕсли у вас болезнь, беременность или вы принимаете лекарства, посоветуйтесь с врачом.<q>Бог не требует вредить здоровью.</q>'}
    ]},
    {slug:'desyatina',title:'Сколько денег нужно отдавать церкви?',screens:[
      {title:'Добровольно',text:'Никто не может заставить вас платить. В Новом Завете христиане дают добровольно, по возможности и с радостью. Многие ориентируются на десятую часть дохода, но это не плата за Божью любовь.'},
      {title:'Откуда десятина',text:'В Ветхом Завете израильтяне отдавали десятую часть урожая на храм, священников и бедных. Отсюда слово «десятина».\n\nМногие христиане и сегодня откладывают десятую часть на церковь и помощь людям. Но в Новом Завете нет строгой суммы.'},
      {title:'С радостью',text:'<bq>Апостол Павел писал: пусть каждый даёт, как решил в сердце, не с огорчением и не по принуждению, потому что Бог любит того, кто дарит с радостью.</bq>\n\nИисус особо похвалил бедную вдову, которая положила в храме две мелкие монетки. Для Бога важна не сумма, а сердце.'},
      {title:'Когда насторожиться',text:'Если в церкви требуют деньги под угрозой, обещают богатство и здоровье в обмен на пожертвование или не говорят, куда идут деньги, это повод уйти.\n\nБожью милость нельзя купить.<q>Её дают даром.</q>'}
    ]},
    {slug:'seks-do-braka',title:'Что христианство говорит о сексе до брака?',screens:[
      {title:'Подарок для брака',text:'Христиане верят, что секс — хороший Божий подарок, и место ему в браке мужа и жены. Не потому, что Бог против удовольствия, а потому, что близость связывает людей глубже, чем нам кажется.'},
      {title:'Бог не против близости',text:'В Библии есть целая книга, Песнь песней, — о любви и влечении мужчины и женщины. Бог Сам придумал близость, и в ней нет ничего постыдного.\n\nНо Библия говорит: двое становятся одним целым. Близость — это не только тело, а отдача себя.'},
      {title:'Почему в браке',text:'В браке, где двое пообещали друг другу верность, близость строит. Вне брака она часто оставляет раны.\n\nБрак даёт то, что нужно близости: обещание, доверие и уверенность, что тебя не бросят.'},
      {title:'Если это уже было',text:'Многие читают это, когда у них уже была близость вне брака. Это не делает человека хуже других. Бог прощает и этот грех, как и любой другой.\n\nИисус не осудил женщину, которую застали в измене. Он сказал ей: и Я не осуждаю тебя, иди и больше не греши.<q>С Богом можно начать заново.</q>'}
    ]},
    {slug:'alkogol',title:'Можно ли христианину пить алкоголь?',screens:[
      {title:'Пьянство — нельзя',text:'Библия не запрещает вино, но твёрдо запрещает пьянство. Многие церкви, особенно в России, советуют не пить совсем, чтобы не навредить себе и тем, кто борется с зависимостью.'},
      {title:'Вино в Библии',text:'Иисус на свадьбе превратил воду в вино. Вино было обычным напитком на праздниках.\n\nНо Библия много раз предупреждает: не напивайтесь, пьянство разрушает человека. Пьяницы названы среди тех, кто идёт против Бога.'},
      {title:'Почему многие не пьют',text:'Многие евангельские христиане в России вообще не употребляют алкоголь. Причина простая: в стране, где пьянство губит столько семей, проще не начинать.\n\nАпостол Павел писал, что лучше не пить вина, если это может подтолкнуть другого человека ко греху. Любовь к людям важнее собственной свободы.'},
      {title:'Если есть зависимость',text:'Зависимость — не повод стыдиться и прятаться. Бог может освободить и от неё. Многие люди бросили пить, когда пришли к Богу и получили поддержку других христиан.\n\n<q>Не оставайтесь одни: обратитесь к врачу, в группу поддержки или в церковь, где помогают зависимым.</q>'}
    ]},
    {slug:'volya-boga',title:'Как понять, чего Бог хочет от меня?',screens:[
      {title:'Главное уже известно',text:'Большую часть Божьей воли мы уже знаем: любить Бога и людей, быть честными, не делать зла. А в остальных решениях Бог даёт свободу и помогает через Библию, молитву, советы мудрых людей и обстоятельства.'},

    if(idx>0){idx--;showScreen(true);return}
    var p=prevStory();
    if(p){cur=p;idx=cur.screens.length-1;bars.innerHTML='';try{history.replaceState(null,'','#'+cur.slug)}catch(e){}showScreen(true)}
  }
  function next(){
    if(typing){showDone();return}
    firstHint=false;
    if(idx<cur.screens.length-1){idx++;showScreen()}
    else{done[cur.slug]=true;save();showEnd()}
  }
  // касание левой части экрана листает только внутри сторис и никуда не уводит
  function prev(){if(canBack())back()}

  function card(s,lab){
    return '<button type="button" class="card'+(done[s.slug]?' done':'')+'" data-k="'+s.slug+'"><small>'+lab+'</small><b>'+s.title+'</b>'+(done[s.slug]?'<span>✓ просмотрено</span>':'')+'<i class="go" aria-hidden="true">→</i></button>';
  }
  function bind(){
    choice.querySelectorAll('.card').forEach(function(b){b.addEventListener('click',function(){start(b.dataset.k,mode==='all'?'all':'next')})});
    var a=$('allBtn');if(a)a.addEventListener('click',showAll);
    var g=$('againBtn');if(g)g.addEventListener('click',function(){start(cur.slug,entry)});
  }
  function showEnd(){
    stopTyping();stage.hidden=true;choice.hidden=false;
    mode='end';idx=total()-1;setProgress();updBack();
    var g=group(cur),nx=cur.slug==='gospel'?BY['kto-takoy-iisus']:g[g.indexOf(cur)+1]; /* после Евангелия — сразу первый урок */
    var h='<h2>'+(nx?'Что дальше?':'Все истории пройдены')+'</h2><div class="cards">';
    if(nx)h+=card(nx,'Следующая история · '+label(nx));
    h+='</div><a class="read" href="'+cur.slug+'.html">Читать '+noun(cur)+' «'+cur.title+'» полностью</a>';
    h+='<button type="button" class="restart" id="againBtn">Посмотреть ещё раз</button>';
    h+='<button type="button" class="restart" id="allBtn">Все истории</button>';
    choice.innerHTML=h;bind();
  }
  function showAll(){
    if(mode!=='all')allFrom={slug:cur.slug,idx:idx,mode:mode};
    stopTyping();stage.hidden=true;choice.hidden=false;mode='all';updBack();
    var h='<h2>Все истории</h2><p class="sub">По одной на каждый урок, вопрос и статью. Можно смотреть по порядку или выбрать любую.</p>';
    PARTS.forEach(function(p,pi){
      h+='<div class="part-h">'+(pi+1)+'. '+p+'</div><div class="cards">';
      L.forEach(function(s){if(s.part===pi)h+=card(s,'Урок '+s.n)});
      h+='</div>';
    });
    [['Вопросы',Q],['Статьи',A]].forEach(function(gr){
      h+='<div class="part-h">'+gr[0]+'</div><div class="cards">';
      gr[1].forEach(function(s){h+=card(s,label(s))});
      h+='</div>';
    });
    choice.innerHTML=h;choice.scrollTop=0;bind();
  }

  function start(slug,from){entry=from||'page';allFrom=null;cur=BY[slug]||L[0];idx=0;bars.innerHTML='';try{history.replaceState(null,'','#'+cur.slug)}catch(e){}showScreen()}

  stage.addEventListener('click',function(e){
    // точки внизу слайда: сразу к нужному слайду
    var b=e.target.closest&&e.target.closest('[data-go]');
    if(b){firstHint=false;idx=+b.dataset.go;showScreen(idx>0);return}
    var r=stage.getBoundingClientRect();
    if(e.clientX-r.left<r.width*.3)prev();else next();
  });
  backBtn.addEventListener('click',back);
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'&&canBack()){e.preventDefault();back();return}
    if(!choice.hidden)return;
    if((e.key===' '||e.key==='Enter')&&e.target.closest&&e.target.closest('[data-go]'))return; /* точка в фокусе — пусть сработает она */
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();next()}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  });
  $('topicsBtn').addEventListener('click',showAll);
  window.addEventListener('hashchange',function(){var k=location.hash.slice(1);if(BY[k]&&k!==cur.slug)start(k)});

  start(location.hash.slice(1));
})();
</script>

</body>
