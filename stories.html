<style>
/* Одна вертикальная «сторис» на весь экран: ночь, которая светлеет к концу истории.
   Сверху полоски прогресса, в центре печатается текст, снизу встаёт солнце. Один тёмный мир по замыслу. */
:root{
  --night:#121830;      /* фон, ночное небо */
  --night-2:#1E2746;    /* карточки выбора */
  --line:#2C3760;       /* полоски, обводки */
  --text:#F4F1EA;       /* основной текст */
  --muted:#A9B0C6;      /* подсказки */
  --sun:#F0B54A;        /* солнце, акцент */
  --glow:#FFD59A;       /* свечение рассвета */
  --f-display:"Manrope",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
/* вся область слайда — это кнопка «дальше»; рамку вокруг неё не показываем, она мешает читать */
.stage:focus,.stage:focus-visible{outline:none}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}

/* фон: одно звёздное небо на все слайды */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 70% at 50% 110%,#26305C 0%,transparent 60%),linear-gradient(180deg,#0B1026 0%,var(--night) 55%,#1A2247 100%)}
.sky b{position:absolute;border-radius:50%;background:#FFF6E0}
.sky b.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}

/* верх */
.top{position:relative;z-index:2;display:grid;gap:10px}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--text);transition:width .25s}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.story-name{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.topics-btn{border:1px solid var(--line);background:color-mix(in srgb,var(--night) 70%,transparent);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.topics-btn:hover{border-color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center}
.close{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:15px}
.close:hover{border-color:var(--muted)}

/* сцена */
.stage{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;cursor:pointer;min-height:0;padding-bottom:14vh}
.line{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(18px,4.8vw,22px);line-height:1.5;letter-spacing:-.005em;text-wrap:pretty;white-space:pre-line}
.line .q{color:var(--text);font-weight:700}
.ghost{visibility:hidden}
/* рамки в тексте слайда: пример, как это было, притча — мягкая плашка с подписью; слова из Библии — золотая полоска */
.line .sx{display:block;margin:14px 0;border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--text) 7%,transparent);transition:opacity .35s}
.line .sx[data-l]::before{content:attr(data-l);display:block;margin-bottom:4px;font-family:var(--f-body,inherit);font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--sun)}
.line .sx-bq{background:none;border-radius:0;padding:2px 0 2px 16px;border-left:3px solid var(--sun);font-style:italic}
.line.typing .sx:not(.on){visibility:hidden;opacity:0}
.line.typing .sx.on{opacity:1}
/* оформленный слайд: номер и подпись, заголовок, текст, точки внизу */
.stage.framed{padding-bottom:9vh;overflow-y:auto}
.stage.framed .line{font-weight:500;font-size:clamp(17px,4.5vw,20px);line-height:1.55;color:color-mix(in srgb,var(--text) 92%,var(--muted))}
.slide-head{margin-bottom:14px}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.mnum{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--sun);background:color-mix(in srgb,var(--sun) 14%,transparent);color:var(--sun);font-family:var(--f-display);font-weight:800;font-size:20px}
.mlab{flex:none;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.stitle{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(23px,6vw,30px);line-height:1.22;letter-spacing:-.015em;text-wrap:balance}
.truth{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.truth::after{display:none}
.slide-foot{margin-top:44px}
.mdots{display:flex;align-items:center;gap:0;margin-left:-4px}
/* точка — кнопка: видно маленький кружок, а нажимать можно по области побольше */
.mdots button{border:0;background:none;padding:12px 4px;margin:0;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.mdots i{display:block;width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s,background .2s}
.mdots button:hover i{background:var(--muted)}
.mdots i.past{background:color-mix(in srgb,var(--sun) 45%,var(--line))}
.mdots i.on,.mdots button:hover i.on{width:24px;background:var(--sun)}
@media (max-height:700px){.stage.framed{padding-bottom:7vh}.stage.framed .line{font-size:16.5px;line-height:1.5}.stitle{font-size:22px}.mh{margin-bottom:10px}.mnum{width:38px;height:38px;font-size:18px}.slide-foot{margin-top:32px}}
/* шапка слайда: подпись в золотой плашке («Миф 2 из 7», «2 из 4»), без линий */
.mh{display:flex;align-items:center;margin-bottom:16px}
.mh::after{display:none}
.vlab{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--sun) 55%,transparent);background:color-mix(in srgb,var(--sun) 12%,transparent);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sun)}
.vlab::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sun)}
.hint{position:absolute;left:0;right:0;bottom:2vh;text-align:center;font-size:14px;color:var(--muted);opacity:0;transition:opacity .4s}
.hint.on{opacity:1}

/* выбор темы */
.choice{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:18px;min-height:0;overflow:auto;padding-block:12px 6vh}
.choice h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7.6vw,38px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.choice p.sub{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;text-align:left;width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--night-2) 88%,transparent);cursor:pointer;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--sun);transform:translateY(-1px)}
.card b{font-family:var(--f-display);font-size:19px;font-weight:700}
.card span{grid-column:1;color:var(--muted);font-size:14.5px;line-height:1.4}
.card .go{grid-row:1/3;grid-column:2;width:38px;height:38px;border-radius:50%;background:var(--sun);color:var(--night);display:grid;place-items:center;font-weight:800}
.card.done .go{background:transparent;border:1.5px solid var(--sun);color:var(--sun)}
.part-h{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.card small{grid-column:1;grid-row:1;font-size:12.5px;color:var(--sun);font-weight:600}
.read{display:flex;align-items:center;justify-content:center;padding:14px 18px;border-radius:999px;background:var(--text);color:var(--night);font-weight:600;text-decoration:none;text-align:center}
.read:hover{opacity:.92}
.restart{align-self:flex-start;border:0;background:none;color:var(--muted);text-align:left;font-size:15px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:4px}

/* кнопка «Назад» внизу: работает на любом слайде и на экране «Что дальше?» */
.nav{position:relative;z-index:2;display:flex;justify-content:flex-start;padding-top:10px}
.back-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--night) 70%,transparent);border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer}
.back-btn:hover{border-color:var(--muted)}
.back-btn:disabled{opacity:.35;cursor:default;border-color:var(--line)}

@media (prefers-reduced-motion:reduce){
  .bars i b,.hint{transition:none}
  .sky b.tw{animation:none}
}
</style>

<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<div class="app">
  <div class="top">
    <div class="bars" id="bars"></div>
    <div class="bar-row"><span class="story-name" id="storyName"></span><span class="top-actions"><button class="topics-btn" id="topicsBtn" type="button">Все истории</button><a class="close" href="home.html" aria-label="Закрыть сторис и вернуться на сайт">✕</a></span></div>
  </div>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Дальше">
    <div class="slide-head" id="slideHead" hidden></div>
    <p class="line" id="line" aria-live="polite"></p>
    <div class="slide-foot" id="slideFoot" hidden></div>
    <div class="hint" id="hint">Нажми, чтобы продолжить</div>
  </div>
  <div class="choice" id="choice" hidden></div>
  <div class="nav"><button type="button" class="back-btn" id="backBtn" aria-label="Назад, к предыдущему слайду"><span aria-hidden="true">←</span> Назад</button></div>
</div>

<script>
(function(){
  // История на каждый урок маршрута «Начать с нуля». Ключ — адрес урока.
  var PARTS=['Знакомство','Бог и человек','Что пошло не так','Что сделал Бог','Ответ человека'];
  var L=[
    {slug:'kto-takoy-iisus',part:0,title:'Кто такой Иисус?',screens:[
      {title:'Кто Он?',text:'Его имя знает почти каждый. Годы на календаре мы считаем от Его рождения.\n\nХристиане верят: Иисус — не просто хороший человек. Он — Бог, Который пришёл к людям и стал одним из нас.'},
      {title:'Автор в своей книге',text:'<fr>Представьте, что автор книги вошёл в свою историю как один из героев. Он живёт среди персонажей, говорит с ними, и его можно узнать.</fr>\n\nХристиане верят, что Бог сделал именно это.'},
      {title:'Настоящий человек',text:'Иисус жил около 2000 лет назад в Израиле. Вырос в Назарете, работал плотником, уставал и плакал, как любой человек.\n\nВ советское время говорили, что Иисус — выдумка. Но сегодня историки, даже неверующие, не сомневаются: Он жил на самом деле.'},
      {title:'Он делал то, что может только Бог',text:'Одним словом Иисус успокаивал бурю на озере и исцелял больных. Такое не под силу ни одному человеку.\n\nА ещё Он прощал людям всё зло, которое они сделали против Бога. Простить обиду может только тот, кого обидели. Поэтому прощать грехи может только Сам Бог.'},
      {title:'Что Он говорил о Себе',text:'Бога Иисус называл Отцом. И говорил: Я и Отец — одно.\n\nКогда ученик Фома сказал Ему «Господь мой и Бог мой», Иисус не поправил его.'},
      {title:'За это Его казнили',text:'Иисуса казнили не за преступление. Религиозные лидеры возмутились, что Он, человек, называет Себя Богом.\n\nПолучается, люди того времени хорошо понимали, что Он говорит о Себе. Спорили именно о том, кто Он.'},
      {title:'Зачем Он пришёл',text:'Чтобы вернуть людей к Богу. Люди отдалились от Бога и сами дорогу назад не находят. Иисус говорил, что пришёл найти тех, кто потерялся.\n\nПочему так вышло, разберём в следующих историях. А пока <q>по Иисусу можно узнать, какой Бог.</q>'}
    ]},
    {slug:'est-li-bog',part:0,title:'Есть ли Бог?',screens:[
      {title:'Бог есть?',text:'Многие думают так: Бога никто не видел, значит, Его, скорее всего, нет. Христиане отвечают: Бог есть.\n\nДоказать это как задачу по математике нельзя. Но и доказать, что Его нет, тоже нельзя. Можно посмотреть, на что указывает мир вокруг.'},
      {title:'На что указывает мир',text:'Большинство учёных считают, что вселенная была не всегда: когда-то она появилась. А ничего не появляется само из ничего. Значит, кто-то её начал.'},
      {title:'Что есть внутри нас',text:'Каждый знает, что мучить ребёнка плохо. Плохо на самом деле, а не потому, что так договорились. Это чувство называют совестью. Христиане верят, что его вложил в нас Бог.\n\nА ещё нам всегда чего-то не хватает. Христиане верят, что это тоска по Богу.'},
      {title:'Почему Его не видно',text:'Автор может войти в свою книгу. Пока он сам туда не вошёл, герои не могли его увидеть, хотя без него не было бы ни строчки. Так и Бога не найти в телескоп: Он не часть мира, Он его создал.\n\nЕсли бы Бог показался во всей Своей силе, мы склонились бы перед Ним от страха. А Он хочет, чтобы люди пришли к Нему сами, по любви. Но Бог не прячется: Он Сам пришёл к людям и стал человеком — Иисусом.'},
      {title:'Как узнать самому',text:'У Иисуса есть слова, которые знают почти все: «ищите, и найдёте». Бог обещает: кто честно ищет Его, тот Его найдёт.\n\nМногие начинали с простой честной молитвы: «Бог, если Ты есть, покажи мне Себя».'},
      {title:'А если я сомневаюсь?',text:'Это нормально. Однажды к Иисусу пришёл отец с больным сыном. Он честно сказал: я верю, но мне трудно, помоги мне поверить. Иисус не прогнал его за сомнения. Он помог.\n\nВерить не значит перестать думать. <q>Можно задавать вопросы и искать ответы.</q>'}
    ]},
    {slug:'chto-takoe-bibliya',part:0,title:'Что такое Библия?',screens:[
      {title:'Книга, через которую говорит Бог',text:'Библию знают все, хотя читали её немногие. Христиане верят, что это книга, через которую говорит Бог. Её писали люди, но Бог вёл их.'},
      {title:'Целая библиотека',text:'Слово «Библия» значит «книги». И правда, под одной обложкой собраны 66 книг. Их писали около 40 человек примерно 1500 лет: цари, пастухи, рыбаки, врач.\n\nТам есть истории, песни, мудрые советы и письма. Но у всех книг одна общая история: как люди ушли от Бога и как Бог их возвращает.'},
      {title:'Больше 63 тысяч перекличек',text:'Люди, которые изучают Библию, насчитали в ней больше 63 тысяч перекличек между разными местами: одно место цитирует другое, продолжает его мысль или рассказывает, как сбылось обещанное.\n\nМногие авторы жили в разные века и никогда не встречались. А получилась одна книга с общим сюжетом. Христиане видят в этом знак, что у Библии один Автор.'},
      {title:'Две части',text:'Библия делится на Ветхий и Новый Завет. «Завет» значит «союз» между Богом и людьми, а «ветхий» — просто «старый».\n\nВетхий Завет — о том, что было до Иисуса: как Бог создал мир, как люди отвернулись от Него и как Бог обещал прийти им на помощь. Новый Завет — об Иисусе и первых христианах. Главный герой всей Библии — Иисус.'},
      {title:'Можно ли ей доверять',text:'Христиане уверены, что можно. От большинства древних книг сохранились единицы или десятки старых копий. А от Нового Завета — больше 5000 древних рукописей, и это одна и та же книга.\n\nУ Мёртвого моря нашли свитки, которым больше 2000 лет. Их сравнили с сегодняшней Библией, и смысл совпал. А археологи не раз находили города и людей, о которых она пишет.'},
      {title:'С чего начать',text:'Не с первой страницы. Четыре рассказа о жизни Иисуса называют Евангелиями. Лучше всего начать с Евангелия от Марка: оно самое короткое.\n\n<q>Библия — 66 книг с одной общей историей, и в центре её — Иисус.</q>'}
    ]},
    {slug:'kakoy-bog',part:1,title:'Какой Бог?',screens:[
      {title:'Каким мы Его представляем',text:'Строгий старик на облаке? Безличная энергия? Добрый дедушка, который всё разрешает? Многие представляют Бога именно так.\n\nХристиане отвечают: Бог — Тот, Кто создал всё, и Он любит людей. С Ним можно говорить: Он живой и слышит.'},
      {title:'Создал всё и слышит нас',text:'Бог был всегда, ещё до того, как появился мир. Всё, что есть, создал Он.\n\nИ Он не безличная сила. Он — личность: думает, чувствует, говорит. Энергии не скажешь «спасибо» и не расскажешь, что у тебя болит. А Богу можно.'},
      {title:'В Нём нет зла',text:'Библия называет Бога святым. Это значит, что в Нём нет ни капли зла: Он никогда не лжёт и не делает подлостей.\n\nИ Он справедлив. Ему не всё равно, когда обижают слабых и обманывают честных.'},
      {title:'И Он любит',text:'Библия говорит: «Бог есть любовь». Он любит каждого человека, даже того, кто о Нём не думает.\n\nНо любовь не бывает равнодушной к злу. <q>Бог любит людей и не закрывает глаза на зло.</q>'}

    {slug:'zachem-chelovek',part:1,title:'Зачем существует человек?',screens:[
      {title:'Зачем я живу?',text:'«Зачем я живу?» Рано или поздно этот вопрос задаёт себе каждый.\n\nХристиане отвечают: человек создан, чтобы жить рядом с Богом и любить Бога и людей.'},
      {title:'Мы похожи на Бога',text:'Библия говорит, что Бог создал человека по Своему образу. Это значит, что мы немного похожи на Него: умеем любить, придумывать новое, отличать добро от зла.\n\nПоэтому ценен каждый человек: малыш, старик, больной. Просто потому, что он человек.'},
      {title:'Созданы для любви',text:'<ev>Однажды Иисуса спросили, какая заповедь главная. Он ответил: любить Бога всем сердцем. А второе — любить ближнего, как самого себя.</ev>\n\nВот для чего мы созданы. Поэтому нам так нужны семья, друзья, близость.'},
      {title:'Почему без Бога пусто',text:'Многие знают это чувство: всё есть, а внутри пустота. Человек создан для жизни с Богом, и без Него ему чего-то не хватает.\n\n<q>Но Бог зовёт каждого к Себе.</q>'}

    {slug:'chto-takoe-greh',part:2,title:'Что такое грех?',screens:[
      {title:'Знакомо каждому',text:'Слово «грех» звучит старомодно. Но речь о том, что знакомо каждому.\n\nГрех — это когда человек живёт по-своему, как будто Бога нет, и поступает против Его воли. Отсюда ложь, зависть, жестокость и всё зло в мире.'},
      {title:'Как это началось',text:'Библия рассказывает о первых людях, Адаме и Еве. Бог дал им всё и попросил только об одном: не есть плодов с одного дерева.\n\nНо змей обманул их. Он сказал, что Бог от них что-то скрывает. Библия называет этого змея дьяволом. Они поверили ему и решили, что сами знают лучше. С этого начался разрыв между людьми и Богом.'},
      {title:'Не только поступки',text:'Грех — это не только кража или убийство. Это и ложь, и обидные слова, и зависть в мыслях. И даже добро, которое мы могли сделать, но не сделали.\n\nНет человека, который ни разу не солгал и не обидел. Поэтому Иисус и сказал: <q>«Не судите, и сами не будете судимы»</q>.'},
      {title:'Главное в грехе',text:'Грех — прежде всего разрыв с Богом. Плохие поступки — уже следствие этого.\n\n<q>Но Бог не оставил нас: Он Сам пришёл, чтобы вернуть нас к Себе.</q>'}

    {slug:'posledstviya-greha',part:2,title:'Почему грех — это серьёзно?',screens:[
      {title:'Серьёзнее, чем кажется',text:'«Все не идеальны, что тут такого?» Так думают многие.\n\nХристиане отвечают: грех ломает жизнь. Он встаёт стеной между человеком и Богом. Ложь и предательство разрушают семьи. А то, что казалось свободой, становится зависимостью. Библия говорит, что итог греха — смерть.'},
      
      {title:'Будет суд',text:'Каждый однажды ответит перед Богом за свою жизнь. Звучит страшно.\n\nНо разве мы хотим, чтобы тот, кто мучил детей, никогда не ответил? Суд значит, что справедливость есть. Только отвечать придётся и нам.'},
      {title:'Хорошие дела не помогут',text:'Хорошие дела не исправляют того, что уже сломано. Сами мы не справимся. Нам нужна помощь. <q>И Бог её дал.</q>'}

    {slug:'obeshchanie',part:3,title:'Бог не отказался от человека',screens:[
      {title:'Бог не отвернулся',text:'Люди отвернулись от Бога. Можно было бы ожидать, что и Бог отвернётся от них. Но Он сразу пообещал, что спасёт людей.\n\n<ex>Как родители, у которых сын ушёл из дома: они не перестают ждать и сами ищут способ его вернуть.</ex>'},
      {title:'Шаг за шагом',text:'Бог выбрал Авраама и пообещал: через твоих потомков добро придёт ко всем народам. Из них вырос народ Израиля, и Бог дал ему десять заповедей: не убивай, не кради, не лги.\n\nПотом Бог посылал пророков — людей, через которых Он говорил. Они обещали: придёт Спаситель.'},

    {slug:'iisus-syn-bozhiy',part:3,title:'Почему Иисуса называют Богом?',screens:[
      {title:'Что значит «Сын Божий»',text:'Христиане называют Иисуса Сыном Божьим. Это не значит, что у Бога родился ребёнок, как у людей. И не значит, что когда-то Сына не было: Он был всегда.\n\nСын человека — тоже человек. Так и Сын Бога — тоже Бог.'},
      {title:'Кому молился Иисус?',text:'Вы, наверное, слышали слова «во имя Отца и Сына и Святого Духа». Христиане верят: Бог один. Но Он существует как Отец, Сын и Святой Дух. Это не три бога, а один. Это называют Троицей.\n\nЧеловеком стал Сын. Поэтому на земле Иисус молился Отцу по-настоящему, как сын говорит с отцом. И научил нас тоже обращаться к Богу как к Отцу. Так начинается молитва «Отче наш».'},

      {title:'Соединяет с Богом',text:'<q>Иисус — и Бог, и человек, поэтому Он может соединить людей с Богом.</q>'}

    {slug:'krest',part:3,title:'Почему Иисус умер на кресте?',screens:[
      {title:'Знак казни',text:'Крест был самой позорной казнью в Римской империи.\n\nПочему же христиане носят крест на груди? Потому что на кресте Иисус умер вместо нас. Он принял наказание, которое заслужили мы.'},

      {title:'Справедливость и любовь',text:'Так Бог и наказал зло, и простил людей. Зло не осталось безнаказанным — это справедливость. Наказание понёс Сам Бог, Который стал человеком, — это любовь.\n\nИисус пошёл на это Сам. Он говорил: нет любви больше, чем отдать жизнь за друзей.'},

    {slug:'blagodat',part:4,title:'Благодать',screens:[
      {title:'Нельзя заработать',text:'Всё в жизни приходится заслуживать: оценки, зарплату, уважение. Многие думают, что и с Богом так же.\n\nХристиане отвечают: нет. Прощение Бога нельзя заработать, его можно только получить в подарок. Эту доброту Бога называют благодатью.'},
      {title:'Подарок не покупают',text:'Хорошие дела не стирают зла, которое мы уже сделали. А Иисус уже сделал всё нужное на кресте.\n\n<ex>Представьте, что отец дарит маленькому сыну подарок, а сын протягивает ему свои карманные деньги — хочет за него заплатить. Отцу станет грустно: это уже не подарок.</ex>\n\nТак и с Богом: <q>Его прощение не покупают, его берут с благодарностью.</q>'},
      {title:'Для всех одинаково',text:'Нет людей «слишком плохих» для Бога и нет тех, кто «и так хороший».\n\nРядом с Иисусом распяли разбойника. У него уже не было времени исправиться. Он только попросил Иисуса вспомнить о нём и услышал: сегодня же будешь со Мной в раю.'},
      {title:'Можно жить как хочешь?',text:'Нет. Когда человек понимает, как сильно его любят, он не ищет, как бы сделать больно тому, кто его любит.\n\nДобро человек делает уже не ради того, чтобы Бог его принял. Бог его уже принял. <q>Добро становится ответом на Его любовь.</q>'}

    {slug:'vera-i-pokayanie',part:4,title:'Вера и покаяние',screens:[
      {title:'Как принять подарок',text:'Подарок мало предложить — его нужно взять. Как принять прощение Бога?\n\nИисус говорил коротко: покайтесь и верьте. Покаяться — значит повернуться к Богу. Верить — значит довериться Иисусу.'},
      {title:'Покаяться — развернуться',text:'<ex>Представьте, что вы едете и понимаете, что едете не туда. Можно пожалеть и ехать дальше. А можно развернуться.</ex>\n\nПокаяние — это такой разворот. Человек честно говорит Богу: я жил так, как будто Тебя нет. И поворачивается к Нему. Цель не в том, чтобы мучить себя. Цель — вернуться домой.'},

      {title:'Особых слов не нужно',text:'Не нужны ни обряд, ни особые слова: Бог смотрит на сердце. Многие просто говорят с Богом своими словами. Кто-то приходит к этому за вечер, кто-то за месяцы.\n\nТому, кто доверился Иисусу, Бог обещает прощение. <q>Оно держится не на чувствах, а на обещании Бога.</q>'}

      {title:'Что писали не христиане',text:'О Нём писали не только христиане. Римский историк Тацит упоминает Христа, казнённого при Пилате. Иудейский историк Иосиф Флавий пишет о брате Иисуса.\n\nРимский наместник Плиний Младший в письме императору рассказывает, что христиане поют гимны Христу как Богу.'},
      {title:'Записано при свидетелях',text:'Евангелия написаны в первые десятилетия после смерти Иисуса, когда ещё были живы свидетели. Письма апостола Павла ещё раньше, примерно через 20 лет.'},
      {title:'О чём спорят на самом деле',text:'Так что спорят не о том, жил ли Иисус. Спорят о том, кем Он был.\n\nИ этот вопрос Иисус задаёт каждому: <q>А вы кем считаете Меня?</q>'}
    ]},
    {slug:'kak-chitat-bibliyu',title:'Как начать читать Библию?',screens:[
      {title:'Не с первой страницы',text:'Не начинайте с первой страницы. Многие так делают, застревают на длинных списках законов и бросают.\n\nБиблию не обязательно читать подряд. Лучше всего начать с Евангелия от Марка. Оно самое короткое.'},
      {title:'Что читать дальше',text:'Потом возьмите Евангелие от Иоанна: оно глубже объясняет, кто такой Иисус. Дальше — книгу Деяний апостолов, о первых христианах. А потом начало книги Бытия и Псалмы.\n\nСтарый Синодальный перевод красивый, но местами трудный. Для начала удобнее современные переводы, их много в бесплатных приложениях.'},
      {title:'Понемногу',text:'Читайте понемногу, когда есть время. Лучше прочитать немного и понять, чем много и ничего не запомнить.\n\nЗадавайте себе простые вопросы: о чём здесь говорится? Что это говорит о Боге и о человеке? И помните, что рассказ, песня и письмо читаются по-разному.'},
      {title:'Если непонятно',text:'Если что-то непонятно, это нормально. Записывайте вопросы и ищите ответы в разделе «Вопросы» и в словаре.\n\nЕщё лучше читать вместе с кем-то. И можно попросить Бога помочь понять.'}
    ]},
    {slug:'protivorechiya',title:'Есть ли в Библии противоречия?',screens:[
      {title:'Противоречий нет',text:'Нет, настоящих противоречий в Библии нет. Есть места, которые с первого взгляда кажутся противоречиями.\n\nНо если посмотреть внимательнее, большинство из них объясняется. И ни одно такое место не касается главного: кто такой Иисус и что Он сделал.'},
      {title:'Один ангел или два',text:'Например, одно Евангелие говорит, что у пустой гробницы был один ангел, а другое — что два. Так выглядят рассказы честных свидетелей: каждый запомнил своё.\n\nЕсли бы четыре рассказа совпадали слово в слово, это было бы подозрительно. А в главном все сходятся: гробница пуста, Иисус воскрес.'},
      {title:'Разные вопросы',text:'Иногда авторы просто отвечают на разные вопросы. Павел пишет, что человека спасает вера. Иаков пишет, что вера без дел мертва.\n\nОба говорят одно: настоящая вера видна по жизни. А поэзию нельзя читать как протокол. Когда в псалме горы прыгают, как овцы, это поэзия.'},
      {title:'Трудные места',text:'Есть места, о которых спорят до сих пор, и мы этого не скрываем. Обычно нам просто не хватает знаний о языке и обычаях того времени.\n\nТакие места касаются мелочей: чисел, имён, порядка событий. Главное они не меняют: <q>Иисус жил, умер и воскрес.</q>'}
    ]},
    {slug:'khoroshiy-chelovek',title:'Разве хорошего человека Бог не примет?',screens:[
      {title:'Хороших дел недостаточно',text:'Бог принимает человека не за хорошие дела. Хороших людей много, но тех, кто ни разу не сделал зла, нет.\n\nНа фоне преступников мы выглядим неплохо. Но Бог хочет, чтобы мы любили Его и других людей всем сердцем. А так не живёт никто из нас.'},
      {title:'Добро не стирает зло',text:'Иисус говорил, что гнев — уже шаг к убийству, а нечистый взгляд — уже измена. По такой мерке виноваты все.\n\nИ добрые дела не стирают плохие: Божий суд — не весы.'},
      {title:'Двое в храме',text:'<pr>Иисус рассказал историю о двух людях в храме. Уважаемый человек хвалился перед Богом, какой он хороший. А сборщик налогов, которого все презирали, только просил: Боже, прости меня.</pr>\n\nИисус сказал, что Бог принял второго. Иногда к Богу мешает прийти уверенность, что мне не за что просить прощения.'},
      {title:'Хорошая новость',text:'Хорошая новость: <q>Бог прощает каждого, кто доверится Иисусу.</q> Это подарок, его не нужно заслуживать. Дверь открыта всем, даже тем, кто сделал много зла.\n\nА добрые дела всё равно важны. Христианин делает добро, потому что Бог его уже принял.'}
    ]},
    {slug:'kak-molitsya',title:'Как начать молиться?',screens:[
      {title:'Разговор с Богом',text:'Молитва — это разговор с Богом. Особые слова не нужны: говорите своими словами, как с тем, кто вас любит и слышит.\n\nМолиться можно вслух или про себя, дома или в метро. Можно совсем коротко: «Боже, помоги».'},
      {title:'Молитва «Отче наш»',text:'Иисус дал ученикам пример молитвы, «Отче наш». Из неё видно, о чём можно говорить с Богом.\n\nОбращаться к Нему как к Отцу. Просить о простом, например о хлебе на сегодня. Просить прощения и самому прощать других. Просить защиты от зла.'},
      {title:'Если нет слов',text:'Бывает, что не знаешь, что сказать. Так бывает со всеми.\n\nМожно просто помолчать перед Богом. Можно прочитать псалом из Библии как свою молитву. А можно просто поблагодарить: за день, за людей рядом, за то, что Он слышит.'},
      {title:'Если Бог молчит',text:'Иногда кажется, что Бог не отвечает. Это знакомо многим верующим.\n\nНо Бог — любящий Отец, и Он знает, что нам на самом деле нужно. Ответ бывает «да», «нет» или «подожди». <q>Молитва нужна, чтобы быть с Богом</q>, а не чтобы Им управлять.'}
    ]},
    {slug:'mnogo-tserkvey',title:'Почему так много разных церквей?',screens:[
      {title:'Три главные ветви',text:'Христиане разделились из-за споров о том, как понимать веру и как устроить церковь. Сейчас есть три главные ветви: православие, католичество и протестантизм.\n\nРазличия между ними настоящие. Но в главном большинство христиан согласны.'},
      {title:'Как это случилось',text:'В 1054 году церковь разделилась на западную, с центром в Риме, и восточную, с центром в Константинополе. Западную стали называть католической, восточную — православной. Для обеих главное — Библия и Предание, то есть учение церкви, которое передаётся из века в век. У католиков решает Папа Римский вместе с епископами, у православных — епископы вместе.'},
      {title:'Протестанты',text:'В XVI веке Мартин Лютер и другие сказали: главное — только Библия, а прощение Бог даёт тем, кто Ему доверяет. Так появились протестанты: сначала лютеране, а позже баптисты, евангельские христиане и другие.'},
      {title:'Что общего',text:'Что общего у большинства христиан? Бог один: Отец, Сын и Святой Дух. Иисус — Сын Божий, Который стал человеком. Он умер за наши грехи, воскрес и вернётся.\n\nА спорят о другом: как понимать крещение и причастие, кто руководит церковью, какое место у церковных традиций.'},
      {title:'Церковь или секта',text:'Как отличить церковь от секты? Насторожитесь, если отрицают, что Иисус — Бог, Который стал человеком. Если слово лидера ставят выше Библии. Если отрывают от семьи, требуют денег и запрещают задавать вопросы.\n\nПеред арестом Иисус молился, чтобы все, кто в Него поверит, были едины. <q>Христиан объединяет Сам Иисус.</q>'}
    ]},
    {slug:'raznye-religii',title:'Почему существуют разные религии?',screens:[
      {title:'Люди ищут Бога',text:'Люди во всём мире ищут Бога. Библия говорит, что Бог Сам вложил в сердце человека мысль о вечности.\n\nПоэтому христиане уважают искренний поиск. И признают, что в других религиях есть правда о совести и добре.'},
      {title:'Разные ответы',text:'Часто говорят: все религии — разные тропинки на одну гору. Но на главные вопросы они отвечают по-разному.\n\nОдин Бог или много богов? Что не так с миром? Как это исправить? Кто такой Иисус: пророк, учитель или Сын Божий? Ответы часто противоположные, поэтому все сразу правы быть не могут.'},
      {title:'Бог пришёл Сам',text:'Во многих религиях человек должен сам дотянуться до Бога: правилами, усилиями, заслугами.\n\nХристианство говорит, что мы сами не дотянемся. Поэтому <q>Бог Сам пришёл к нам: Он стал человеком, Иисусом.</q> И прощение Он даёт в подарок.'},
      {title:'Можно не соглашаться и дружить',text:'Верить, что Иисус — единственный путь к Богу, не значит смотреть на других свысока. Иисус учил любить всех, даже врагов. Можно не соглашаться и при этом дружить.\n\nНе верьте нам на слово. Посмотрите на Иисуса сами.'}
    ]},
    {slug:'kto-sozdal-boga',title:'Кто создал Бога?',screens:[
      {title:'Никто',text:'Многие спрашивают: если всё создал Бог, то кто создал Бога? Христиане отвечают: никто.\n\nУ Бога нет начала. Создать можно только то, что когда-то началось. А Бог был всегда.'},
      {title:'У всего, что начинается',text:'Правило «у всего есть причина» звучит точнее так: причина есть у всего, что начинается.\n\nБольшинство учёных считают, что у Вселенной было начало. Значит, и у неё есть причина. А у Того, Кто не начинался, причины быть не может.'},
      {title:'Что-то есть всегда',text:'В начале всего должно стоять что-то, что существует само по себе. Атеисты обычно говорят, что это материя. Христиане верят, что это живой Бог.'},
      {title:'Бог не начинался',text:'Вопрос «Кто создал Бога?» к Богу не подходит: Он не начинался.\n\nБиблия с первых слов говорит о Боге как о Том, Кто уже есть. <q>Бог был до всего</q>, а всё остальное появилось благодаря Ему.'}
    ]},
    {slug:'troitsa',title:'Как Бог может быть один и при этом Отец, Сын и Святой Дух?',screens:[
      {title:'Один Бог',text:'Христиане верят: Бог один. Но Он существует как Отец, Сын и Святой Дух. Это называется Троицей.\n\nЭто не три бога. И не один Бог, Который по очереди надевает три маски. Отец, Сын и Дух существуют одновременно.'},
      {title:'Все Трое в одной сцене',text:'Когда Иисус крестился в реке, Святой Дух опустился на Него, как голубь. А с неба прозвучал голос Отца: это Мой любимый Сын.\n\nВ одной сцене — все Трое. И при этом христиане верят в одного Бога.'},
      {title:'Сравнения не подходят',text:'Троицу часто сравнивают с водой: лёд, жидкость и пар. Но вода не бывает всем этим сразу. А Отец, Сын и Дух есть всегда и говорят друг с другом.\n\nТочного примера в нашем мире нет. Бог больше всего, что Он создал.'},
      {title:'Любовь была всегда',text:'Библия говорит: Бог есть любовь. Но любить можно только кого-то. Кого Бог любил до сотворения мира?\n\nОтец всегда любил Сына, а Сын — Отца. <q>Любовь была в Боге всегда.</q> И Он зовёт нас в эту любовь.'}
    ]},
    {slug:'chemu-uchil-iisus',title:'Чему учил Иисус?',screens:[
      {title:'Две главные заповеди',text:'Иисуса однажды спросили: какая заповедь главная? Он ответил: люби Бога всем сердцем. И люби ближнего, как самого себя.\n\nВсё остальное, сказал Иисус, держится на этих двух.'},
      {title:'Слова, которые знают все',text:'Многие слова Иисуса знают даже те, кто никогда не открывал Библию. Не судите, и не будете судимы. Любите врагов ваших.\n\nИ ещё: как хотите, чтобы с вами поступали люди, так поступайте и вы с ними. Все эти слова прозвучали в Его Нагорной проповеди.'},
      {title:'Бог — любящий Отец',text:'Иисус называл Бога Отцом и учил людей обращаться к Нему так же.\n\n<pr>Он рассказал о сыне, который ушёл из дома и растратил всё. А отец ждал его, увидел издалека и сам выбежал навстречу.</pr>\n\n<q>Так и Бог ждёт каждого, кто вернётся к Нему.</q>'},
      {title:'Глубже правил',text:'Иисус шёл глубже обычных правил. Не только «не убивай», но и не злись на брата. Не только «не изменяй», но и не смотри на женщину с желанием.\n\nЧестно говоря, так не живёт никто. Иисус показал, как высока планка Бога. И что человеку нужно прощение.'},
      {title:'О Себе',text:'Иисус учил не только о жизни, но и о Себе. Он говорил: Я — путь, истина и жизнь. Он прощал людям грехи, хотя это может только Бог.\n\nПоэтому люди снова и снова спрашивали: <q>кто же Он такой?</q>'}
    ]},
    {slug:'chudesa',title:'Можно ли верить в чудеса Иисуса?',screens:[
      {title:'Можно ли в это верить',text:'Иисус исцелял больных, кормил тысячи людей пятью хлебами, ходил по воде и воскрешал мёртвых. Можно ли в это верить?\n\nХристиане отвечают: да. Бог создал мир и его законы, значит, Он может и действовать в этом мире.'},
      {title:'Разве наука против?',text:'Нет. Наука изучает, как мир работает обычно. Но она не может доказать, что Тот, Кто создал мир, никогда не сделает ничего необычного.\n\n<q>Чудо — это когда Бог делает то, что не под силу человеку.</q>'},
      {title:'Что говорят свидетели',text:'О чудесах рассказывают все четыре Евангелия. Многие чудеса видели толпы людей.\n\nДаже противники Иисуса не спорили, были ли чудеса. Они говорили, что Он творит их злой силой. Значит, о Его необычных делах знали и те, кто в Него не верил.'},
      {title:'Зачем были чудеса',text:'Иисус никогда не делал чудес напоказ. Он помогал конкретным людям: слепым, больным, голодным.\n\nЧудеса показывали, Кто Он. И каким будет мир, когда Бог всё исправит. А <q>главное чудо — воскресение</q>.'}
    ]},
    {slug:'rozhdestvo-i-pasha',title:'Что на самом деле празднуют на Рождество и на Пасху?',screens:[
      {title:'Что за праздниками',text:'Рождество и Пасху празднуют почти все. Но что за ними стоит?\n\nНа Рождество христиане празднуют рождение Иисуса. Они верят, что этот ребёнок — Бог, Который пришёл к людям.'},
      {title:'Рождество',text:'Иисус родился в городке Вифлееме. Его положили в ясли — кормушку для скота, потому что в гостинице не было места.\n\nМногие церкви празднуют Рождество 25 декабря. Русская православная церковь тоже 25 декабря, но по старому календарю. По нашему это 7 января.'},
      {title:'Пасха',text:'Иисуса распяли в пятницу. А в воскресенье утром женщины нашли Его гробницу пустой. Ангел сказал им: Он воскрес.\n\nОтсюда приветствие, которое знают почти все: «Христос воскрес!» — «Воистину воскрес!». Пасха — самый главный праздник христиан.'},
      {title:'Традиции и суть',text:'Куличи, крашеные яйца, ёлка и подарки появились позже. Многие видят в них символы, например яйцо как знак новой жизни.\n\nНо суть не в традициях. Рождество — о том, что Бог пришёл к нам. А Пасха — о том, что <q>смерть побеждена</q>.'}
    ]},
    {slug:'ne-izmenili-li-bibliyu',title:'Не изменили ли текст Библии за 2000 лет?',screens:[
      {title:'Не исказили',text:'Часто говорят: за две тысячи лет Библию сто раз переписали, значит, всё исказили. Переписывали много раз — это правда. Но не исказили.\n\nТекст Библии дошёл до нас очень точно. Сохранились тысячи древних рукописей, и их можно сравнить между собой.'},
      {title:'Тысячи рукописей',text:'Нового Завета на греческом сохранилось больше пяти тысяч рукописей. Ни одна другая древняя книга не сохранилась в стольких копиях.\n\nСами книги написаны в I веке, а самые ранние копии, которые дошли до нас, — уже во II веке.'},
      {title:'Свитки Мёртвого моря',text:'В 1947 году пастух нашёл в пещере у Мёртвого моря древние свитки. Среди них был свиток со всей книгой пророка Исаии. Он на тысячу лет старше всех рукописей этой книги на древнееврейском, известных до этого.\n\nУчёные сравнили его с текстом, который мы читаем сегодня. <q>Смысл не изменился.</q> Различия — в мелочах, например в написании слов.'},
      {title:'Спорные места',text:'Да, в рукописях есть различия. Чаще всего мелкие: как написано слово, в каком порядке стоят слова.\n\nЕсть и места, о которых учёные спорят: были ли они в самом первом тексте. В современных переводах Библии такие места отмечены.'},
      {title:'Главное не изменилось',text:'Ни одно учение христиан не держится на спорном месте. Даже если убрать все спорные места, <q>главное останется: Бог, Иисус, Его смерть на кресте и воскресение.</q>\n\nБог позаботился, чтобы Его слова дошли до нас целыми. Он хочет, чтобы каждый мог Его узнать.'}
    ]},
    {slug:'zhestokiy-bog',title:'Почему в Ветхом Завете Бог кажется жестоким?',screens:[
      {title:'Один и тот же Бог',text:'Многие говорят: в Ветхом Завете Бог злой, а в Новом добрый. Христиане верят, что это один и тот же Бог — справедливый и милосердный.\n\nНекоторые места читать тяжело, и христиане этого не скрывают. Но стоит посмотреть внимательнее.'},
      {title:'Иона и Ниневия',text:'Сам Ветхий Завет называет Бога милосердным и долготерпеливым. Вспомните Иону, которого проглотила огромная рыба.\n\nБог послал Иону во вражеский город. Жители раскаялись, и Бог их пощадил. Иона даже обиделся, что Бог так добр к врагам.'},
      {title:'Суд над страшным злом',text:'Наказания в Ветхом Завете — почти всегда суд над страшным злом. Например, народы Ханаана приносили в жертву детей.\n\nБог ждал больше четырёхсот лет, прежде чем наказать. А тех, кто раскаивался, щадил. Те войны — события прошлого, а не приказ на все времена.'},
      {title:'Справедливость и любовь',text:'Бог не закрывает глаза на зло. Но на кресте Он Сам взял наказание на Себя. <q>Там видно и справедливость, и любовь.</q>'}
    ]},
    {slug:'posle-smerti',title:'Что будет после смерти?',screens:[
      {title:'Смерть — не конец',text:'Христиане верят: со смертью жизнь не заканчивается. Тело умирает, но сам человек продолжает жить и встречается с Богом.'},
      {title:'Сегодня же',text:'Рядом с Иисусом на кресте висел разбойник. Он попросил Иисуса вспомнить о нём.\n\nИисус ответил: сегодня же будешь со Мной в раю. Не через тысячу лет, а сегодня.'},
      {title:'Воскресение',text:'Но христиане верят не только в жизнь души. В конце времён Бог воскресит мёртвых. У людей будут новые тела, которые не болеют и не умирают.\n\nИисус воскрес первым и показал, как это будет. Он сказал: кто верит в Меня, даже если умрёт, оживёт.'},
      {title:'Встреча с Богом',text:'Каждый человек встретится с Богом и даст отчёт о своей жизни. Для того, кто доверился Иисусу, это не страшно: его грехи уже прощены.\n\nПоэтому христиане <q>встречают смерть с надеждой.</q>'}
    ]},
    {slug:'ad',title:'Ад существует на самом деле?',screens:[
      {title:'Ад реален',text:'Существует ли ад на самом деле? Христиане отвечают: да. Иисус говорил об аде чаще и серьёзнее, чем кто-либо в Библии.\n\nНо ад — это не подвал, где черти жарят грешников. Это картинка из народных сказок, а не из Библии.'},
      {title:'Без Бога',text:'Главный ужас ада в том, что там нет Бога. А Бог — источник всего хорошего: любви, радости, света.\n\nБез Бога не остаётся ничего хорошего. Библия описывает это образами огня и тьмы.'},
      {title:'Как это сочетается с любовью',text:'Как же любящий Бог допускает ад?\n\nБог любит людей и поэтому не равнодушен ко злу. Без суда зло просто сошло бы с рук. Но Он не хочет, чтобы кто-то погиб.'},
      {title:'Выход есть',text:'Иисус пришёл, чтобы люди не погибли. На кресте Он взял на Себя наказание, которое заслужили мы.\n\nКто доверяется Ему, получает прощение. <q>Бог сделал всё, чтобы спасти людей.</q>'}
    ]},
    {slug:'prostit-vsyo',title:'Может ли Бог простить мне всё, что я сделал?',screens:[
      {title:'Слишком страшно?',text:'Многие думают: то, что я сделал, Бог не простит. Слишком много, слишком страшно.\n\nНо Библия говорит: нет такого греха, который Бог не простит тому, кто приходит к Нему.'},
      {title:'Кого простил Бог',text:'Павел преследовал христиан и одобрял их казни. Потом он стал апостолом. Пётр трижды отрёкся от Иисуса, пока не пропел петух. Иисус простил его.\n\nА разбойник на кресте ничего не успел исправить. Он только попросил о милости и получил её.'},
      {title:'Иисус шёл к «плохим»',text:'<ev>Закхей собирал налоги и обманывал людей. Иисус увидел его на дереве, позвал по имени и сам пришёл к нему в дом. После этой встречи Закхей вернул людям всё, что отнял, с лихвой.</ev>\n\nИисус обещал: <q>Кто придёт ко Мне, того Я никогда не прогоню.</q>'},
      {title:'Дело не в размере греха',text:'Прощение зависит не от того, насколько тяжёл грех. Оно зависит от того, что сделал Иисус. Он умер на кресте за грехи людей.\n\nЦена была огромной — жизнь Сына Божьего. Её хватит на любой грех.'},
      {title:'Непростительный грех',text:'Иисус говорил, что не простится хула на Святого Духа. Это сознательное и окончательное «нет» Богу.\n\nЕсли вы боитесь, что совершили такой грех, значит, вы его не совершали. <q>К Богу можно прийти с чем угодно.</q>'}
    ]},
    {slug:'zachem-tserkov',title:'Зачем ходить в церковь, если можно верить дома?',screens:[
      {title:'Бог у меня в душе?',text:'Многие говорят: Бог у меня в душе, зачем мне церковь? Верить, конечно, можно и дома.\n\nНо Бог задумал христиан как семью. Слово «церковь» в Библии означает собрание людей, а не здание.'},
      {title:'Одному трудно',text:'В одиночку трудно расти и держаться в тяжёлое время. Поэтому первые христиане постоянно собирались вместе.'},
      {title:'Там не идеальные люди',text:'В церкви не идеальные люди. Там бывают ошибки, обиды и лицемерие.\n\nИисус говорил: врач нужен не здоровым, а больным.'},
      {title:'Какую церковь искать',text:'Ищите общину, где объясняют Библию, в центре Иисус, а к людям относятся с любовью.\n\nИдеальной церкви не найти. <q>Но вместе с другими вера крепнет.</q>'}
    ]},
    {slug:'kreshchenie',title:'Что такое крещение и зачем оно?',screens:[
      {title:'Что это такое',text:'Крещение — это когда человека погружают в воду или обливают водой. Это знак того, что он начинает новую жизнь с Иисусом.\n\nИисус Сам велел крестить Своих учеников. И Сам крестился в реке Иордан.'},
      {title:'Что значит крещение',text:'Как вода смывает грязь, так Бог очищает человека от грехов. Человек погружается в воду и выходит из неё. Это похоже на похороны старой жизни и начало новой.\n\nА ещё в крещении человек открыто, перед всеми, становится частью церкви.'},
      {title:'Почему крестят по-разному',text:'Здесь христиане расходятся. Православные, католики и лютеране крестят и младенцев. Они верят, что в крещении действует Бог.\n\nБаптисты и многие евангельские церкви крестят тех, кто сам осознанно поверил. Мы придерживаемся второго понимания и уважаем тех, кто думает иначе.'},
      {title:'Спасает ли крещение',text:'По евангельскому пониманию, спасает вера в Иисуса, а крещение — её видимый знак. Разбойник на кресте не был крещён, но Иисус пообещал ему рай.\n\nНо крещение важно: <q>его велел Сам Иисус.</q>'}
    ]},
    {slug:'prichastie',title:'Что такое причастие?',screens:[
      {title:'Хлеб и вино',text:'Причастие — это когда христиане вместе едят хлеб и пьют вино или виноградный сок. Так они вспоминают, что Иисус умер за них.\n\nТак велел Сам Иисус на последнем ужине с учениками.'},
      {title:'Тайная вечеря',text:'Многие видели картину Леонардо да Винчи «Тайная вечеря». Так называют последний ужин Иисуса с учениками. В тот вечер Иисус разломил хлеб и сказал, что это Его тело, которое отдаётся за учеников.\n\nПотом дал им чашу вина и сказал, что это Его кровь. И велел делать это в память о Нём.'},
      {title:'Как понимают евангельские христиане',text:'Хлеб и вино — это знаки. Хлеб остаётся хлебом, а вино вином.\n\nНо Христос рядом через Святого Духа, когда люди собираются в Его память.'},
      {title:'Для кого причастие',text:'Причастие — для тех, кто доверился Иисусу. Все едят от одного хлеба, и это показывает, что они одна семья.\n\nПричастие не для идеальных. <q>Оно для тех, кто знает, что нуждается в прощении.</q>'}
    ]},
    {slug:'somneniya',title:'Я сомневаюсь — это нормально для верующего?',screens:[
      {title:'Это нормально',text:'Нормально ли сомневаться, если ты верующий? Да. Сомневались даже ученики Иисуса, которые видели Его своими глазами.\n\nСомнение — это не конец веры. Это вопросы, с которыми можно прийти к Богу.'},
      {title:'Фома неверующий',text:'Выражение «Фома неверующий» знают почти все. Фома не поверил, что Иисус воскрес: пока сам не потрогаю раны, не поверю.\n\nИисус пришёл и предложил ему потрогать раны. Он не отругал Фому, а ответил на его сомнение. И Фома сказал: Господь мой и Бог мой!'},
      {title:'Помоги моему неверию',text:'Отец больного мальчика сказал Иисусу: верую, Господи, помоги моему неверию. Иисус помог ему.\n\nДаже маленькой веры, смешанной с сомнением, было достаточно. Тот, кто сомневается, всё ещё ищет.'},
      {title:'Что делать с сомнениями',text:'Говорите о сомнениях с Богом. Ищите ответы. Поговорите с христианином, которому доверяете.\n\nИ помните: чувства меняются, а Иисус нет. <q>Вера держится на Нём, а не на чувствах.</q>'}
    ]},
    {slug:'nauka-i-vera',title:'Наука и вера мешают друг другу?',screens:[
      {title:'Не мешают',text:'Часто говорят: наука давно опровергла Бога. Христиане с этим не согласны. Наука и вера отвечают на разные вопросы.\n\nНаука объясняет, как устроен мир. Вера отвечает, почему он вообще есть и зачем мы живём.'},
      {title:'А Галилей?',text:'Историю Галилея часто подают как войну науки с верой. Но Галилей сам был верующим.\n\nЦерковные судьи решили, что его учение спорит с Библией. Но ошиблись люди: они неверно поняли Библию. Это не спор Бога с наукой.'},
      {title:'Верующие учёные',text:'Многие великие учёные верили в Бога. Ньютон открыл закон всемирного тяготения и много писал о Библии. Основатель генетики Мендель был монахом.\n\nА теорию Большого взрыва первым предложил Жорж Леметр. Он был священником.'},
      {title:'Об эволюции',text:'Об эволюции христиане спорят: одни понимают первые главы Библии буквально, другие нет. Но в главном согласны все.\n\nМир создал Бог, и <q>мы здесь не случайно.</q>'}
    ]},
    {slug:'hristiane-plokho',title:'Почему христиане иногда поступают плохо?',screens:[
      {title:'Христиане тоже грешат',text:'Многих отталкивает христианство из-за самих христиан. Лицемерие, крестовые походы, плохие поступки верующих.\n\nХристиане тоже грешат. Христианин — это не тот, кто стал лучше других. Это тот, кто признал, что ему нужен Бог.'},
      {title:'Иисус против лицемеров',text:'Сильнее всего Иисус ругал не грешников, а лицемеров. Он знал, что среди Его учеников будут плохие люди. Даже один из двенадцати, Иуда, предал Его.\n\nКогда христиане делают зло, они поступают против учения Иисуса.'},
      {title:'Смотреть на Иисуса',text:'Войны во имя веры и казни несогласных — это зло, и его незачем оправдывать. Иисус говорил: любите врагов. Когда Пётр взял меч, Иисус велел его убрать.\n\nКогда христиане поступают плохо, они идут против Иисуса, а не за Ним. Учение лучше проверять по Самому Иисусу.'},
      {title:'И добро тоже',text:'Христиане основали одни из первых больниц и приютов, боролись против рабства, заботились о бедных.\n\nЦерковь — не собрание идеальных людей. Но <q>Бог меняет людей</q>, медленно и по-настоящему.'}
    ]},
    {slug:'pochemu-boga-ne-vidno',title:'Почему Бога не видно?',screens:[
      {title:'Не предмет нашего мира',text:'Бог — не предмет нашего мира, поэтому Его нельзя увидеть глазами, как дерево или человека. Но Он не прячется: христиане верят, что Бог Сам пришёл к людям и стал человеком — Иисусом.'},
      {title:'Бог стал видимым',text:'Ученики Иисуса видели Его, слышали и трогали руками.\n\nОдин из учеников, Филипп, попросил: покажи нам Отца. Иисус ответил: кто видел Меня, видел и Отца.'},
      {title:'Почему не в полной силе',text:'Если бы Бог явился во всей силе, никто не смог бы с Ним спорить. Но Бог хочет не покорности от страха, а доверия и любви. Любовь силой не получишь.\n\nМногие видели чудеса Иисуса и всё равно не поверили. Значит, дело не только в том, чтобы увидеть.'},
      {title:'Как узнать Бога',text:'Через Библию, через молитву, через людей, которых Он изменил.\n\nИисус сказал: <q>Блаженны те, кто поверил, не видя Меня.</q>'}
    ]},
    {slug:'bog-muzhchina',title:'Бог мужчина или женщина?',screens:[
      {title:'Ни то, ни другое',text:'Ни то, ни другое. Бог — Дух, у Него нет тела и пола. Библия называет Его Отцом не потому, что Он мужчина, а чтобы показать, как Он относится к нам.'},
      {title:'Бог — Дух',text:'Мужчина и женщина — это то, какими Бог создал людей. Сам Бог — Творец, а не часть творения. Библия говорит, что Бог — Дух.\n\nБог создал человека похожим на Себя — и мужчину, и женщину. Значит, оба одинаково отражают что-то от Бога.'},
      {title:'Почему Отец',text:'Так Бога называл Иисус, и так Он научил молиться: «Отче наш». Слово «Отец» говорит о заботе, защите и близости. Бог не далёкая сила, а Тот, Кто любит, как родитель.\n\nХристиане говорят о Боге «Он» по примеру Библии. Это не значит, что женщины дальше от Бога или меньше Ему дороги.'},
      {title:'Как мать',text:'Бог говорит, что утешит людей, как мать утешает ребёнка. Иисус сравнил Себя с птицей, которая собирает птенцов под крылья.\n\n<q>Оба образа говорят об одном: Бог любит нас глубже и вернее, чем самые лучшие родители.</q>'}
    ]},
    {slug:'bog-nakazhet',title:'Бог меня накажет?',screens:[
      {title:'Бог не ищет, за что наказать',text:'Бог не ищет, за что вас наказать. Он любит вас и хочет простить.\n\nБог справедлив и не закрывает глаза на зло. Но Он Сам дал выход.'},
      {title:'Божий гнев другой',text:'Мы злимся, когда нас задели или когда мы устали. Божий гнев другой: это твёрдое «нет» злу, которое губит людей.\n\nБог против зла, потому что любит нас.'},
      {title:'Потерянная овца',text:'<pr>Иисус рассказал о пастухе, у которого из ста овец потерялась одна. Пастух оставил остальных и искал, пока не нашёл. А потом нёс её домой на плечах и радовался.</pr>\n\nТак Иисус объяснил, как Бог относится к человеку, который от Него ушёл.'},
      {title:'Наказание понёс Иисус',text:'Иисус умер на кресте и принял на Себя наказание за наши грехи.\n\n<q>Кто доверился Иисусу, тот больше не стоит перед Богом как обвиняемый.</q>'},
      {title:'Беда — не всегда наказание',text:'Ученики увидели человека, слепого от рождения, и спросили Иисуса: кто согрешил, он или его родители? Иисус ответил: ни он, ни родители. А потом исцелил его.'}
    ]},
    {slug:'zachem-sozdal-mir',title:'Зачем Бог создал мир?',screens:[
      {title:'Из любви',text:'Из любви: чтобы поделиться жизнью и радостью. Не потому, что Ему было одиноко или скучно.'},
      {title:'Богу не было одиноко',text:'Иногда думают: Бог создал людей, потому что Ему было одиноко. Но христиане верят, что в Боге всегда была любовь. Отец, Сын и Святой Дух любили друг друга ещё до сотворения мира.\n\nЗначит, мир — не способ заполнить пустоту.'},
      {title:'Мир — подарок',text:'Бог хотел, чтобы было кому радоваться Его миру и Его любви.\n\nВ начале Библии Бог смотрит на всё, что создал, и видит: всё очень хорошо.'},
      {title:'Для чего мы устроены',text:'Человек создан, чтобы знать Бога, любить Его и заботиться о мире. Это не тяжёлая обязанность, а то, для чего мы устроены.\n\n<q>Поэтому по-настоящему хорошо человеку только рядом с Богом.</q>'}
    ]},
    {slug:'svoboda-i-sudba',title:'Если Бог всё знает заранее, есть ли у меня свобода?',screens:[
      {title:'Свобода есть',text:'Да, свобода есть. Бог знает будущее, но это не значит, что Он нас заставляет. Наши решения настоящие, и мы за них отвечаем.'},
      {title:'Знать — не значит заставлять',text:'Бог видит всю нашу жизнь сразу. Он знает, что мы выберем. Но знать — не значит выбирать за нас.\n\nВыбор остаётся нашим, и он настоящий.'},
      {title:'Бог правит и зовёт',text:'Бог управляет историей, и ничто не выходит из-под Его власти. И при этом Бог снова и снова зовёт людей: выберите жизнь, вернитесь ко Мне.\n\nКак именно одно сочетается с другим, мы до конца не понимаем. Христиане разных церквей объясняют это по-разному. Но все согласны: Бог не играет людьми, как куклами.'},
      {title:'Не рок, а Бог',text:'Христианство не верит в рок, который всё решил за нас. За миром стоит не безличная судьба, а Бог, Который нас любит.\n\nПоэтому можно спокойно принимать решения и молиться о них.<q>А ошибки не перечёркивают жизнь: Бог умеет исправлять и их.</q>'}
    ]},
    {slug:'kak-vyglyadel',title:'Как выглядел Иисус?',screens:[
      {title:'Точно не знаем',text:'Точно мы не знаем: Евангелия не описывают Его внешность. Скорее всего, Он был похож на обычного еврея своего времени: смуглый, темноволосый, с руками рабочего человека.'},
      {title:'Евангелия молчат',text:'Авторы Евангелий подробно пишут, что Иисус говорил и делал, но не пишут, какого Он был роста и какого цвета у Него глаза. Им было важнее, Кто Он.'},
      {title:'Каждый рисует по-своему',text:'Художники разных стран рисовали Иисуса похожим на своих. В Европе Он светлый, в Эфиопии темнокожий, в Китае — с восточными чертами.\n\nЗнаменитые картины и иконы — это не портреты. Это попытка показать, Кто Он: Бог, Который стал человеком.'},
      {title:'Туринская плащаница',text:'Некоторые считают, что на этой ткани отпечаталось тело Иисуса. Анализ 1988 года показал, что ткань средневековая, но споры продолжаются. Христианская вера от этого спора не зависит.'},
      {title:'Не за красоту',text:'Пророк Исаия за 700 лет до Иисуса писал, что в Нём не будет ничего броского.<q>Люди шли к Нему не за красотой, а потому, что Он любил, исцелял и говорил правду.</q>'}
    ]},
    {slug:'devstvennoe-rozhdenie',title:'Правда ли Иисус родился от девы?',screens:[
      {title:'Да, это чудо',text:'Да, христиане верят, что Мария была девственницей, когда зачала Иисуса: у Него не было земного отца. Это чудо. Так Бог показал, что Иисус — не просто ещё один человек, а Сын Божий, пришедший в мир.'},
      {title:'Что рассказывают Евангелия',text:'Два Евангелия, от Матфея и от Луки, рассказывают: ангел пришёл к молодой девушке Марии и сказал, что она родит Сына от Святого Духа. Мария удивилась: как это будет, если у меня нет мужа?\n\nЕё жених Иосиф сначала хотел тихо расторгнуть помолвку. Но ангел явился ему во сне, и Иосиф поверил и взял Марию в жёны.'},
      {title:'Люди знали, откуда дети',text:'Люди древности прекрасно знали, откуда берутся дети. Поэтому Иосиф и встревожился. Авторы Евангелий понимали, насколько это необычно.\n\nНо если Бог создал саму жизнь, Ему не трудно начать одну жизнь по-особому.'},
      {title:'Знак того, Кто Он',text:'Иисус — не человек, который со временем стал Богом. Бог Сам пришёл в мир и стал человеком. Необычное рождение — знак этого.\n\nИногда это путают с «непорочным зачатием». У католиков так называется учение о том, что сама Мария была зачата без греха. Протестанты и православные так не учат.<q>А в рождение Иисуса от девы верят все христиане.</q>'}
    ]},
    {slug:'vydumka-voskreseniya',title:'Может, воскресение Иисуса — выдумка учеников?',screens:[
      {title:'Нет',text:'Нет. Ученики были готовы умереть за то, что видели живого Иисуса. За выдумку, которую сам сочинил, так не умирают.'},
      {title:'Пустая могила',text:'Иисуса казнили и похоронили. На третий день Его могила оказалась пустой. Ученики были уверены, что видели Его живым.\n\nИ вера в воскресение быстро распространилась прямо в Иерусалиме, где каждый мог проверить.'},
      {title:'За ложь не умирают',text:'После казни ученики прятались от страха. А потом вдруг стали бесстрашно говорить о воскресении и шли за это в тюрьму и на смерть. Человек может умереть за ложь, если сам в неё верит. Но за ложь, которую сам придумал, никто не умирает.\n\nИ если бы ученики сочиняли, вряд ли первыми свидетелями сделали бы женщин: слову женщин в то время в суде не верили.'},
      {title:'Не галлюцинация',text:'Галлюцинация бывает у одного человека, а не у многих сразу. Павел пишет, что Иисус однажды явился больше чем пятистам людям, и многие из них ещё живы — можно расспросить.\n\nА главное, видение не объясняет пустую могилу. Власти легко остановили бы слухи, показав тело. Но тела не было.<q>Иисус правда жив — и с Ним можно говорить уже сегодня.</q>'}
    ]},
    {slug:'vtoroe-prishestvie',title:'Иисус правда вернётся?',screens:[
      {title:'Да, вернётся',text:'Да. Иисус обещал вернуться, и христиане всех церквей в это верят. Когда это будет, не знает никто, поэтому все предсказания точных дат — ошибка.'},
      {title:'Что обещал Иисус',text:'Иисус обещал ученикам, что вернётся. А когда Он вознёсся на небо, ангелы сказали им: Он придёт снова. Тогда Он будет судить мир, воскресит умерших и исправит всё сломанное.'},
      {title:'Даты не знает никто',text:'Иисус сказал прямо: о том дне и часе не знает никто, кроме Отца. Поэтому, когда кто-то объявляет конец света на конкретное число, это не от Бога.\n\nТаких предсказаний было очень много. Ни одно не сбылось.'},
      {title:'Как ждать',text:'Без страха и паники. Иисус сравнил это с хозяином, который уехал и может вернуться в любой момент. Хороший слуга не боится, а спокойно делает то, что поручил хозяин, и ждёт его.\n\n<q>Для христиан это добрая новость: зло и боль не навсегда.</q>'}
    ]},
    {slug:'vethiy-i-novyy',title:'Чем Ветхий Завет отличается от Нового?',screens:[
      {title:'Две части Библии',text:'Ветхий Завет — это книги, написанные до Иисуса: о сотворении мира, о народе Израиля и об обещании Спасителя. Новый Завет — книги об Иисусе и первых христианах. Для христиан это одна история: в первой части Бог обещает, во второй исполняет.'},
      {title:'Ветхий Завет',text:'Это самая большая часть Библии — примерно три четверти. В ней рассказ о сотворении мира, истории Авраама, Моисея, царя Давида, песни-молитвы псалмов и слова пророков.\n\nЧерез всё это проходит одна мысль: Бог не оставил людей и пошлёт Того, Кто всё исправит.'},
      {title:'Новый Завет',text:'Это 27 книг. Четыре Евангелия рассказывают о жизни Иисуса, книга Деяний — о первых христианах, а письма апостолов объясняют, как жить с верой.\n\nПоследняя книга, Откровение, говорит о том, чем закончится история мира.'},
      {title:'Что значит «завет»',text:'Завет — это союз, договор между Богом и людьми. А «ветхий» — по-старинному «старый». Старый союз Бог заключил с народом Израиля через Моисея. Новый — через Иисуса, и он открыт для всех людей.'},
      {title:'Почему нужны обе',text:'Без Ветхого Завета непонятно, Кого ждали и зачем пришёл Иисус. Без Нового — как Бог исполнил обещание.<q>Сам Иисус постоянно ссылался на Ветхий Завет и говорил, что эти книги рассказывают о Нём.</q>'}
    ]},
    {slug:'kanon',title:'Почему в Библии именно эти книги?',screens:[
      {title:'Церковь признала',text:'Потому что христиане узнали в этих книгах Слово Божье. Их написали пророки, апостолы и их ближайшие ученики. Евангелия и письма апостолов читали в церквях с самого начала, а о нескольких книгах спорили дольше. Церковь эти книги не выбирала, а признала.'},
      {title:'Как отбирали книги',text:'Уже в первые десятилетия христиане читали на собраниях Евангелия и письма апостолов. Главный вопрос был простой: написано ли это апостолом или тем, кто знал апостолов?\n\nК концу IV века список из 27 книг стал общепринятым. Церковь не придумала его, а подтвердила то, что давно читали в церквях.'},
      {title:'Ветхий Завет',text:'Ветхий Завет христиане приняли от иудеев. Иисус и апостолы читали эти книги как Слово Божье.\n\nВ православной и католической Библии есть ещё несколько книг, написанных незадолго до Иисуса. Католики считают их частью Писания. Православные называют их неканоническими, но полезными для чтения. Протестанты не включают их в Библию.'},
      {title:'Потерянные евангелия',text:'Многие тексты, которые иногда называют «потерянными евангелиями», написаны через сто и больше лет после Иисуса. Их авторы не знали Его и часто учили совсем другому.\n\n<q>А книги Нового Завета написали те, кто знал Иисуса или Его учеников.</q>'}
    ]},
    {slug:'perevody',title:'Какой перевод Библии выбрать?',screens:[
      {title:'Начните с понятного',text:'Для первого чтения лучше взять современный перевод: он написан понятным языком. Синодальный перевод красивый и самый известный, но многие слова в нём устарели.'},
      {title:'Синодальный перевод',text:'Это самый распространённый русский перевод, ему около 150 лет. Его читают и православные, и протестанты. Он точный и торжественный.\n\nНо язык XIX века местами труден: «дабы», «доколе», «ланиты». Новичку бывает сложно понять смысл.'},
      {title:'Современные переводы',text:'Есть переводы на обычный современный язык. Например, «Современный русский перевод» Российского библейского общества и «Новый русский перевод».\n\nИх делали знатоки древних языков. Читать их легче, а смысл тот же.'},
      {title:'Что выбрать',text:'Начните с современного перевода, чтобы понять смысл. А когда захочется сравнить, откройте Синодальный: его выражения встречаются в книгах, песнях и в речи.\n\n<q>Многие приложения для телефона позволяют читать несколько переводов рядом.</q>'}
    ]},
    {slug:'prorochestva',title:'Сбылись ли пророчества Библии?',screens:[
      {title:'Да, сбылись',text:'Да. Задолго до Иисуса пророки сказали, где Он родится, как будет страдать и что Его смерть будет за других. Всё это совпало с жизнью Иисуса.'},
      {title:'Кто такой пророк',text:'Пророк в Библии — это не гадалка. Это человек, через которого Бог говорил людям. Чаще всего пророки открыто говорили людям об их зле и звали вернуться к Богу.\n\nНо иногда они говорили и о будущем, особенно о Том, Кого пошлёт Бог.'},
      {title:'Что предсказали',text:'Пророк Михей сказал, что Спаситель родится в маленьком Вифлееме. Пророк Исаия писал о Слуге Божьем, Которого будут презирать, Который будет страдать за чужие грехи и будет похоронен с богатым.\n\nВ одном из псалмов описано, как над страдающим смеются, делят его одежду и бросают о ней жребий. Всё это было при казни Иисуса.'},
      {title:'Это нельзя подстроить',text:'Многое человек подстроить не может: где родиться, как тебя казнят, что сделают солдаты у креста.\n\nКнигу Исаии среди свитков Мёртвого моря переписали больше чем за сто лет до рождения Иисуса.<q>Значит, тексты не дописали задним числом.</q>'}
    ]},
    {slug:'sovest',title:'Откуда у нас совесть?',screens:[
      {title:'Голос внутри',text:'Христиане верят, что совесть вложил в человека Бог. Это внутренний голос, который подсказывает, что хорошо, а что плохо. Он есть у всех людей, даже у тех, кто не верит в Бога.'},
      {title:'Закон в сердце',text:'Апостол Павел писал, что Божий закон написан у людей в сердцах. Поэтому даже те, кто никогда не читал Библию, знают, что нельзя предавать друга и мучить слабого.\n\nВо всех культурах люди чувствуют стыд и вину. Это след того, что мы созданы Богом.'},
      {title:'Совесть может ошибаться',text:'Человек, который привык ко злу, может почти не чувствовать вины.\n\nА бывает наоборот: совесть мучает за то, в чём человек не виноват. Поэтому совесть нужно сверять с Библией.'},
      {title:'Совесть не снимает вину',text:'Совесть говорит: ты виноват. Но она не может снять вину. Это может только прощение.\n\nХристиане верят: Бог прощает каждого, кто приходит к Нему через Иисуса.<q>После этого совесть может успокоиться не потому, что вину забыли, а потому, что её простили.</q>'}
    ]},
    {slug:'prostit-drugih',title:'Как простить того, кто причинил мне боль?',screens:[
      {title:'Что значит простить',text:'Простить — значит отказаться от мести и передать суд Богу. Своими силами это трудно, и сразу может не получиться. Начните с честной молитвы: попросите Бога помочь. Часто прощение — не один момент, а путь.'},
      {title:'Что прощение не значит',text:'Простить не значит забыть или сделать вид, что ничего не было. Зло остаётся злом.\n\nПрощение не требует оставаться рядом с тем, кто продолжает причинять вред. Можно простить и при этом защитить себя.'},
      {title:'Как Бог простил нас',text:'В молитве «Отче наш» есть слова: прости нам наши долги, как и мы прощаем нашим должникам. Бог простил нам огромный долг. Поэтому и нас Он зовёт прощать.\n\nИисус, когда Его прибивали к кресту, молился о палачах: Отец, прости им, ведь они не знают, что делают.'},
      {title:'Если не получается',text:'Простить сразу бывает невозможно, особенно если рана глубокая. Можно начать с честной молитвы: Боже, я не могу простить, помоги мне захотеть.\n\nБог видел, что с вами сделали, и Ему не всё равно. <q>Прощение освобождает в первую очередь того, кто прощает.</q>'}
    ]},
    {slug:'samoubiystvo',title:'Самоубийство — это грех, который нельзя простить?',screens:[
      {title:'Нет такого правила',text:'Нет, в Библии нет такого правила. Спасает человека Иисус, а не то, как закончилась его жизнь. Но жизнь — дар Бога, и Бог очень не хочет, чтобы кто-то её обрывал.'},
      {title:'Если вам сейчас плохо',text:'Ваша боль настоящая, и Бог её видит. Но мысль, что выхода нет, — неправда, которую подсказывает боль.\n\nВ Библии есть люди, которые просили Бога забрать их жизнь: пророк Илия, Иов. Бог не осудил их. Илии Он дал отдых и еду, а с Иовом говорил Сам.'},
      {title:'Судит только Бог',text:'Самоубийство часто связано с болезнью, депрессией, невыносимой болью. Судить человека может только Бог, а Он знает всё, что было у него на сердце.\n\nХристиане верят: кто доверился Иисусу, того ничто не может оторвать от Божьей любви, даже смерть.\n\nМногие близкие винят себя. Но всё предвидеть невозможно. <q>Бог не осуждает вас — с этой болью можно прийти к Нему.</q>'},
    ]},
    {slug:'smertnye-grehi',title:'Что такое семь смертных грехов?',screens:[
      {title:'Список из традиции',text:'Это список из церковной традиции, а не из Библии: гордыня, жадность, зависть, гнев, блуд (секс вне брака), чревоугодие (обжорство) и уныние (лень и безразличие ко всему доброму). Его составили древние монахи, чтобы показать корни других грехов.'},
      {title:'Откуда он взялся',text:'Ещё в IV–VI веках монахи заметили, что многие плохие поступки растут из нескольких корней. Например, кража — из жадности, ссоры — из гордости и гнева.\n\nТак появился список главных страстей. В православной традиции их обычно восемь, в католической — семь.'},
      {title:'Любой грех серьёзен',text:'Иногда кажется: есть страшные грехи, а есть мелкие, на которые можно не обращать внимания. Библия говорит строже: любой грех отделяет человека от Бога.\n\nИисус сказал, что даже злоба в сердце — уже грех, как и убийство. Так что грешны все, а не только убийцы.'},
      {title:'Простить можно всё',text:'Нет греха, который Бог не может простить тому, кто приходит к Нему. Иисус умер за все грехи, и «смертные», и «мелкие».\n\nЭтот список полезен, чтобы честно посмотреть на себя.<q>Но не чтобы бояться.</q>'}
    ]},
    {slug:'pochemu-delayu-zlo',title:'Почему я делаю плохое, даже когда не хочу?',screens:[
      {title:'Сила внутри нас',text:'Потому что грех — не только плохие поступки, но и сила внутри нас, которая тянет не туда. Это было знакомо даже апостолу Павлу. Изменить это одной силой воли не получается, но Бог меняет человека изнутри.'},
      {title:'Павел о себе',text:'Апостол Павел, один из самых известных христиан, писал о себе:\n\n<bq>И то, что я делаю, — это не то добро, которое я хотел бы делать. Я продолжаю делать зло, которого не хочу делать.</bq>\n\nТо есть желать хорошего мало. Внутри что-то сломано, и это есть у каждого.'},
      {title:'Корень в сердце',text:'Можно на время сдержаться. Но корень — в сердце: в гордости, обиде, страхе, в желании жить только для себя.\n\nПавел спросил: кто меня избавит? И сам ответил: Бог — через Иисуса Христа.'},
      {title:'Бог меняет изнутри',text:'Когда человек доверяется Иисусу, Бог прощает его и даёт ему Святого Духа. Дух меняет желания изнутри, постепенно, иногда медленно.\n\nХристиане тоже срываются. Но каждый раз можно вернуться к Богу, попросить прощения и начать снова.<q>Бог не устаёт прощать.</q>'}

    {slug:'dyavol',title:'Дьявол существует на самом деле?',screens:[
      {title:'Да, существует',text:'Да, христиане верят, что дьявол реален. Но он не второй бог и не равен Богу. Это ангел, который восстал против Бога. Иисус уже победил его, поэтому тем, кто с Богом, бояться его не нужно.'},
      {title:'Личность, а не символ',text:'Библия описывает дьявола как личность, а не просто как символ зла. Его называют сатаной, то есть противником, и отцом лжи.\n\nБог не создавал его злым. Все ангелы были созданы хорошими, но один из них из гордости восстал против Бога и увлёк других.'},
      {title:'Его оружие — ложь',text:'Его главное оружие — ложь. Он нашёптывает, что Бог нас не любит, что грех безвреден, что прощения нет.\n\nОн не может всего, не знает всего и не может быть везде сразу. Он лишь творение и не может сделать больше, чем позволит Бог.'},
      {title:'Иисус победил',text:'Иисус изгонял злых духов одним словом. На кресте Он лишил дьявола главной силы — права обвинять нас.\n\nПоэтому христиане не ищут бесов за каждым углом и не сваливают на дьявола свои ошибки.<q>Но и не играют с тёмными силами: Библия прямо запрещает гадания, спиритизм и заговоры.</q>'}
    ]},
    {slug:'ot-chego-spasenie',title:'От чего нас спасает Бог?',screens:[
      {title:'От чего и для чего',text:'От греха и того, к чему он ведёт: от вины, от разрыва с Богом и от смерти без надежды. А ещё Бог даёт новую жизнь с Ним, и она начинается уже сейчас.'},
      {title:'То, что не исправить самому',text:'Человек может быть здоров, успешен и доволен. Но у каждого из нас есть поступки, о которых мы жалеем, и то, что самим уже не исправить.\n\nБиблия говорит, что грех отделяет нас от Бога, как стена. А без Бога у жизни нет прочной опоры, а у смерти — надежды.'},
      {title:'Кому нужна помощь',text:'Иисус говорил: врач нужен не здоровым, а больным. Его помощь нужна каждому. Но принимает её тот, кто честно видит, что сам не справится.'},
      {title:'Новая жизнь',text:'Бог прощает вину и убирает стену между нами и Им. Человек получает новую жизнь, мир с Богом и надежду на вечную жизнь.\n\nЭто возможно, потому что Иисус умер за наши грехи и воскрес. <q>Бог делает это, потому что любит нас.</q>'}

      {title:'Коротко',text:'Бог никого не отправляет в ад только за то, что человек не слышал об Иисусе. Каждому взрослому Он даёт возможность узнать о Нём, а решает человек сам.'},
      {title:'Маленькие дети',text:'Маленький ребёнок ещё не понимает, что хорошо, а что плохо. Бог это знает и не судит его как взрослого.'},
      {title:'Взрослому Бог даёт возможность',text:'Бог хочет, чтобы каждый человек Его нашёл. Библия говорит, что Бог рядом с каждым человеком. Поэтому каждому взрослому Бог даёт возможность узнать о Нём: через совесть, через мир вокруг, через людей, которые расскажут об Иисусе. А дальше человек сам решает, принять Бога или нет.'},
      {title:'Бог судит честно',text:'Бог не спросит с человека того, чего тот не мог знать.'},

    {slug:'uverennost',title:'Как понять, что Бог меня простил?',screens:[
      {title:'Не по чувствам',text:'Не по чувствам, а по Божьему обещанию. Бог обещал: кто доверяется Иисусу, тот прощён. Чувства приходят и уходят, а слово Бога остаётся.'},
      {title:'Чувства меняются',text:'Сегодня радостно, завтра тоскливо. Если судить о прощении по настроению, уверенности не будет никогда.'},

      {title:'Перемены внутри',text:'Постепенно человек замечает перемены: ему хочется говорить с Богом, ему больно от своего зла, он начинает любить людей, которых раньше не выносил.\n\nЭто не условие прощения, а то, что из него вырастает.<q>Сомнения при этом бывают у всех, и это не значит, что Бог передумал.</q>'}

    {slug:'vera-besov',title:'Разве недостаточно просто верить, что Бог есть?',screens:[
      {title:'Этого мало',text:'Нет, этого мало. В Библии сказано: даже бесы верят в Бога и трепещут. Христианская вера — это не просто согласие, что Бог существует, а доверие Ему.'},
      {title:'Знать и доверять — разное',text:'Вера в Библии — это когда опираешься на Бога всей жизнью, а не только соглашаешься с Ним в голове.'},
      {title:'Вера — это доверие',text:'Христианская вера — это доверие Иисусу. Я верю, что Он умер за мои грехи и воскрес, и полагаюсь на Его прощение.'},
      {title:'Вера меняет поступки',text:'Апостол Иаков писал, что вера без дел мертва. Не потому, что дела спасают, а потому, что настоящее доверие меняет поступки.\n\n<q>Кто правда доверился Богу, тот начинает жить по-другому.</q>'}

    {slug:'svyatoy-duh',title:'Кто такой Святой Дух?',screens:[
      {title:'Бог, а не сила',text:'Святой Дух — это Бог, а не безличная сила или энергия. Христиане верят, что Он живёт в каждом, кто доверился Иисусу: утешает, учит и постепенно меняет человека изнутри.'},
      {title:'Один Бог — Троица',text:'Христиане верят в одного Бога: Отца, Сына и Святого Духа. Святой Дух не меньше Отца и Сына. Это Троица.\n\nЕго можно огорчить, Он говорит и учит. Это черты личности, а не безличной силы.'},
      {title:'Обещание Иисуса',text:'Перед смертью Иисус сказал ученикам: Я не оставлю вас сиротами. И пообещал, что Отец пошлёт им Святого Духа, Который навеки останется с ними.\n\nНа пятидесятый день после воскресения Святой Дух сошёл на учеников. Христиане вспоминают это в праздник Пятидесятницы. У православных его называют Троицей.'},
      {title:'Что Он делает',text:'Помогает понять Библию. Даёт силы, когда своих не хватает. Напоминает, что мы Божьи дети. И растит в человеке любовь, радость, мир, терпение и доброту.\n\n<q>Это происходит не сразу, а постепенно, год за годом.</q>'}

    {slug:'posty',title:'Нужно ли христианину соблюдать посты?',screens:[

      {title:'Зачем постятся',text:'Цель поста не похудеть и не заслужить Божью любовь. Пост помогает увидеть, что Бог важнее даже хлеба. Вместо еды — молитва.\n\nИисус постился сорок дней в пустыне, прежде чем начал учить людей.'},
      {title:'Не напоказ',text:'Иисус предупреждал: не поститесь напоказ, с печальным лицом, чтобы все видели. Пусть об этом знает только ваш Небесный Отец. Он видит то, что скрыто.\n\nА пророк Исаия писал, что Богу дороже другой пост: накормить голодного, помочь бедному, освободить угнетённого.'},
      {title:'Как в разных церквях',text:'В православной церкви есть календарь постов: Великий пост перед Пасхой, пост перед Рождеством и другие. Протестанты обычно постятся по собственному решению или вместе с церковью в особое время.\n\nЕсли вы болеете, ждёте ребёнка или принимаете лекарства, можно отказаться не от еды, а от чего-то другого привычного. <q>Бог не требует вредить здоровью.</q>'}

    {slug:'desyatina',title:'Сколько денег нужно отдавать церкви?',screens:[

      {title:'Откуда десятина',text:'В Ветхом Завете израильтяне отдавали десятую часть урожая и скота на служение Богу, на священников и бедных. Отсюда слово «десятина».\n\nМногие христиане и сегодня откладывают десятую часть на церковь и помощь людям. Но в Новом Завете нет строгой суммы.'},
      {title:'С радостью',text:'Апостол Павел писал:\n\n<bq>Каждый пусть даёт столько, сколько ему подсказывает сердце, не с огорчением и не по принуждению, потому что Бог любит того, кто жертвует с радостью.</bq>\n\nИисус особо похвалил бедную вдову, которая положила в храме две мелкие монетки. Для Бога важна не сумма, а сердце.'},

      {title:'Бог не против близости',text:'В Библии есть целая книга, Песнь песней, — о любви и влечении мужчины и женщины. Бог Сам придумал близость, и в ней нет ничего постыдного.\n\nНо Библия говорит: двое становятся одним целым. Близость — это не только тело, но и отдача себя.'},
      {title:'Почему в браке',text:'В браке, где двое пообещали друг другу верность, близость укрепляет любовь. Вне брака она часто оставляет раны.\n\nБрак даёт то, что нужно близости: обещание, доверие и уверенность, что тебя не бросят.'},

    {slug:'alkogol',title:'Можно ли христианину пить алкоголь?',screens:[

      {title:'Если есть зависимость',text:'Зависимость — не повод стыдиться и прятаться. Бог может освободить и от неё. Многие люди бросили пить, когда пришли к Богу и получили поддержку других христиан.'}

      {title:'Главное уже известно',text:'Большую часть Божьей воли мы уже знаем: любить Бога и людей, быть честными, не делать зла. А в остальных решениях Бог даёт свободу и помогает через Библию, молитву, советы мудрых людей и обстоятельства.'},
