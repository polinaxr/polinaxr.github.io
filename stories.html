      {title:'Почему это опасно',text:'Гороскоп кажется игрой. Но человек постепенно начинает искать опору в звёздах, картах или в чёрной кошке, а не в Боге.\n\nА гадания и спиритизм — уже не игра. Библия предупреждает, что за ними может стоять злая духовная сила, и велит держаться от этого подальше.'},

      {title:'Сами не справимся',text:'Мы не можем отменить смерть, исправить прошлое или изменить своё сердце усилием воли. Признать это — не слабость, а трезвость.\n\nИисус говорил: врач нужен не здоровым, а больным. Христианство начинается с честности о себе.\n\nИ Бог не стыдит нас за слабость. Он обещает давать силу уставшим.'},

      {title:'Главная заповедь',text:'Иисуса спросили, какая заповедь главная. Он ответил: люби Бога всем сердцем, а ближнего — как самого себя. Все остальные правила вырастают из этого.'},
      {title:'Всё хорошее — от Бога',text:'Дружба, музыка, вкусная еда, природа, смех, праздники — всё это Божьи подарки.\n\n<ev>Первое чудо Иисус сделал на свадьбе. Посреди праздника закончилось вино, и Он превратил воду в вино, чтобы праздник продолжился.</ev>'},
      {title:'Зачем «нельзя»',text:'Бог создал человека и знает, что его разрушает: ложь, зависть, измена, ненависть. Запреты защищают нас и других.'},
      {title:'Что меняется',text:'Уходит то, что ранит: ложь, привычка срываться на близких, зависимости. Друзья остаются. А появляется новое: прощение, покой на душе и Бог рядом.\n\nИисус сказал: <q>Я пришёл, чтобы дать жизнь, и притом в избытке.</q>'}
    ]},
    {slug:'ikony',title:'Зачем христианам иконы?',screens:[
      {title:'Что такое икона',text:'Икона — это изображение Иисуса, Марии или святых. Православным и католикам иконы помогают молиться: они почитают не доску и краски, а того, кто изображён. Мы, протестанты, молимся без икон и обращаемся прямо к Богу через Иисуса.'},
      {title:'Почему без икон',text:'В Библии есть заповедь: не делай себе изображения, чтобы поклоняться ему. Мы опасаемся, что человек начнёт видеть силу в самом предмете.\n\nПоэтому в протестантских церквях обычно нет икон. Бог слышит молитву везде, и путь к Нему открыт через Иисуса.'},
      {title:'Картины не запрещены',text:'Картины на библейские сюжеты никто не запрещает. Они помогают вспомнить историю из Библии. Но молимся мы не им, а Богу.'},
      {title:'Главный образ Бога',text:'<q>Главный образ Бога — Сам Иисус.</q> Он сказал: кто видел Меня, тот видел и Отца. Кто хочет узнать, какой Бог, может смотреть на Иисуса.'}
    ]},
    {slug:'bogu-est-delo',title:'Нас 8 миллиардов — Богу правда есть до меня дело?',screens:[
      {title:'Да, есть',text:'Бог знает вас лично: ваше имя, вашу жизнь и то, что у вас на душе.\n\nЭто у людей внимание заканчивается. Бог создал каждого человека и помнит о каждом.'},
      {title:'Даже волосы сочтены',text:'Иисус говорил, что даже маленькая птица не упадёт на землю без ведома Бога. И добавлял:\n\n<bq>А у вас даже и волосы на голове все сосчитаны! Поэтому не бойтесь — вы дороже множества воробьёв!</bq>'},
      {title:'В толпе Он видел одного',text:'<ev>Иисус шёл через город, вокруг была толпа. Сборщика налогов Закхея все презирали. Он залез на дерево, чтобы хоть издалека увидеть Иисуса. Иисус остановился прямо под этим деревом, позвал его по имени и сказал: сегодня Я приду к тебе в гости.</ev>\n\nИз сотен людей Иисус выбрал того, кого никто не хотел замечать.'},
      {title:'Ради вас Он пришёл Сам',text:'Бог стал человеком, Иисусом, и умер на кресте, чтобы вернуть к Себе каждого.\n\nБог не ждёт, пока вы чего-то добьётесь. Говорите с Ним своими словами. <q>Он слышит.</q>'}
    ]},
    {slug:'pustota-vnutri',title:'Почему внутри пусто, даже когда всё есть?',screens:[
      {title:'Мы созданы для Бога',text:'В человеке есть место, которое не заполняют ни вещи, ни успех, ни даже близкие люди. Оно для Бога.\n\nЭта пустота — тоска по Богу. Она напоминает, что человек создан для большего.'},
      {title:'Суета сует',text:'<ev>Царь Соломон был самым богатым и мудрым человеком своего времени. Дворцы, сады, слава, любые удовольствия — он ни в чём себе не отказывал. А потом написал: суета сует — всё суета. То есть всё пусто и быстро проходит.</ev>\n\nДаже когда есть всё, без Бога этого мало.'},
      {title:'Вечность в сердце',text:'Библия говорит, что Бог вложил в сердце человека вечность. Поэтому нам мало того, что заканчивается: радость от покупки проходит, отпуск кончается, успех забывается.\n\n<q>Сердце ищет то, что не пройдёт.</q>'},
      {title:'Хлеб жизни',text:'Иисус сказал:\n\n<bq>Я Сам и есть хлеб жизни. Кто приходит ко Мне, тот никогда не останется голодным, и кто верит Мне, тот не будет испытывать жажды.</bq>\n\nМожно прямо сейчас сказать Богу своими словами: мне пусто, я хочу найти Тебя.'}
    ]},
    {slug:'bog-ne-otvechaet',title:'Почему Бог не отвечает на мои молитвы?',screens:[
      {title:'Бог слышит',text:'Бог слышит каждую молитву, даже самую тихую. Если ответа не видно, это не значит, что Ему всё равно.\n\n«Нет» и «подожди» — тоже ответы. Бог видит дальше нас и даёт то, что правда хорошо.'},
      {title:'Бог — добрый Отец',text:'Иисус спрашивал: если сын попросит у отца хлеба, разве отец даст ему камень? И объяснял:\n\n<bq>Если вы, будучи злы, умеете давать своим детям благие дары, то тем более Небесный Отец даст благое тем, кто просит у Него!</bq>'},
      {title:'Даже Иисус услышал «нет»',text:'<ev>В ночь перед казнью Иисус молился: Отец, если можно, пусть эти страдания пройдут мимо Меня. Но пусть будет не как Я хочу, а как Ты хочешь. На следующий день Иисуса распяли. Но через этот крест Бог спас людей.</ev>\n\nИногда мы понимаем, зачем было «нет», только потом.'},
      {title:'Не сдаваться',text:'<pr>Иисус рассказывал о вдове, которая снова и снова приходила к несправедливому судье, пока он ей не помог.</pr>\n\nЕсли даже такой судья помог, то Бог тем более слышит Своих детей. Так Иисус учил молиться и не падать духом. Говорите Богу честно, как есть, даже если вы обижены.'},
      {title:'Бог действует',text:'Даже пока ответа не видно, Бог продолжает действовать. Апостол Павел писал:\n\n<bq>Мы знаем, что Бог всё обращает во благо для тех, кто любит Его и кого Он призвал по Своему замыслу.</bq>'}
    ]},
    {slug:'mozhno-greshit-dalshe',title:'Если Бог всё простил — можно грешить дальше?',screens:[
      {title:'Нет',text:'Бог прощает, чтобы человек начал новую жизнь, а не продолжал грешить дальше.\n\nТому, кто доверился Иисусу, Бог даёт Святого Духа. Постепенно человеку и самому хочется жить по-другому. А после срыва можно вернуться к Богу, попросить прощения и встать снова.'},
      {title:'Иди и больше не греши',text:'<ev>К Иисусу привели женщину, которую застали на измене, чтобы забить её камнями. Иисус сказал: кто из вас без греха, пусть первым бросит камень. Все разошлись. А Иисус сказал ей: Я тоже тебя не осуждаю. Иди и больше не греши.</ev>\n\nСначала Иисус простил. А потом позвал жить по-новому.'},
      {title:'Вопрос Павла',text:'Апостол Павел писал, что Бог прощает даром. И сразу сам спросил:\n\n<bq>Продолжать грешить, чтобы умножалась благодать? Ни в коем случае!</bq>\n\nУ того, кто доверился Иисусу, грех больше не хозяин.'},
      {title:'«Бог всё равно простит»',text:'Так думают, пока прощение кажется дешёвым. Но Иисус умер, чтобы мы были прощены.\n\n<q>Когда человек это понимает, ему уже не хочется спокойно продолжать то, за что умер Иисус.</q>'}
    ]},
    {slug:'sudnyy-den',title:'Каким будет Судный день?',screens:[
      {title:'День правды',text:'Иисус Сам рассказал об этом дне. Он придёт снова — уже как Царь. И перед Ним соберутся все люди всех времён.\n\nКаждое слово, каждый поступок — всё выйдет на свет.'},
      {title:'И тут становится страшно',text:'У каждого есть то, о чём стыдно вспоминать. И хороших дел не хватит, чтобы перевесить плохие.'},
      {title:'Кто будет Судьей',text:'Но вот что удивительно: Бог-Отец доверил этот суд Иисусу.\n\n<bq>Отец никого не судит, Он доверил весь суд Сыну.</bq>'},
      {title:'Следы от гвоздей',text:'На руках у Судьи — следы от гвоздей. Он Сам понёс наказание, которое заслужили мы.\n\nКто доверился Иисусу, тот уже прощён. Довериться — значит честно сказать Ему «прости меня» и дальше жить с Ним.'},
      {title:'Можно не бояться',text:'Такой человек увидит на троне не чужого судью, а своего Спасителя.\n\n<bq>В любви нет страха, но совершенная любовь прогоняет его…</bq>\n\n<q>Тот, Кто однажды будет судить мир, сегодня зовёт к Себе каждого.</q>'}
    ]},
    {slug:'chuvstvo-viny',title:'Как избавиться от чувства вины?',screens:[
      {title:'Отдать вину Богу',text:'Вину не надо прятать и тащить на себе. Её надо отдать Богу. Он может снять её полностью.'},
      {title:'Время вину не лечит',text:'<ev>Царь Давид однажды сделал страшное: забрал чужую жену, а её мужа отправил на смерть. И молчал много месяцев, будто ничего не случилось.</ev>\n\nНо пока он молчал, ему было очень тяжело.'},
      {title:'Бог сделал первый шаг',text:'<ev>Бог послал к Давиду пророка. И Давид перестал прятаться. Он честно признал: «Я согрешил». А пророк ответил: Бог снял с тебя грех.</ev>\n\nПотом Давид написал Богу:\n\n<bq>Ты простил вину моего греха.</bq>'},
      {title:'Прощение — не награда',text:'Бог прощает не потому, что вина маленькая. Иисус умер на кресте за наши грехи и понёс наказание вместо нас.\n\nПоэтому прощение не нужно заслуживать или отрабатывать.'},
      {title:'Если вина возвращается',text:'Опирайтесь не на чувства, а на Божье обещание. <q>Бог не вспоминает то, что простил.</q>'}
    ]},
    {slug:'bez-posrednikov',title:'Можно ли молиться Богу напрямую — без святых и свечек?',screens:[
      {title:'Да, можно',text:'Бог слышит каждого, кто приходит к Нему, доверяясь Иисусу. Свечки, иконы и особые места для этого не нужны.\n\nГоворить с Богом можно своими словами, в любом месте и в любое время.'},
      {title:'Завеса в храме',text:'<ev>В древнем храме висела тяжёлая завеса. За ней было самое святое место. Зайти туда мог только главный священник, и то раз в год. Но когда Иисус умер на кресте, эта завеса разорвалась сверху донизу.</ev>\n\nЭто был знак: через Иисуса путь к Богу открыт для каждого.'},
      {title:'Один посредник',text:'<bq>Бог един, един и посредник между Богом и человеком — это Человек Христос Иисус.</bq>\n\nИисус воскрес и теперь Сам просит за нас перед Богом.'},
      {title:'А как же святые?',text:'Православные и католики просят святых помолиться за них. Мы, протестанты, так не делаем. Мы уважаем святых как пример веры, но в Библии люди молятся только Богу.\n\nА попросить живого человека помолиться за вас — это нормально.'},
      {title:'К Отцу — просто так',text:'Свечка или икона не делает молитву сильнее. Иисус учил: когда молишься, войди в свою комнату, закрой дверь и помолись Отцу, Который видит тайное.\n\n<q>Бог — Отец, и к Нему можно прийти просто так.</q>'}
    ]},
    {slug:'snachala-ispravitsya',title:'Нужно ли сначала исправиться, чтобы прийти к Богу?',screens:[
      {title:'Приходите как есть',text:'Нет. К Богу приходят таким, какой ты есть сейчас.\n\nБог сначала принимает человека, а потом помогает ему меняться.'},
      {title:'Врач нужен больным',text:'Иисус говорил: врач нужен не здоровым, а больным.\n\nОн пришёл не к тем, у кого всё правильно, а к тем, у кого жить правильно не получается.'},
      {title:'Отец побежал навстречу',text:'<pr>Сын ушёл из дома и растратил всё, что получил от отца. Когда у него ничего не осталось, он пошёл назад. Отец увидел его издалека, побежал навстречу и обнял.</pr>\n\nСын ещё ничего не успел исправить. Так Бог встречает каждого, кто к Нему возвращается.'},
      {title:'Меняться — вместе с Богом',text:'Если ждать, когда станешь достаточно хорошим, можно ждать всю жизнь. Своими силами это не получается ни у кого.\n\nПеремены начинаются после того, как человек пришёл к Богу. Постепенно, бывает и со срывами. <q>Но уже не в одиночку.</q>'}
    ]},
    {slug:'nuzhno-mnogo-znat',title:'Нужно ли много знать, чтобы прийти к Богу?',screens:[
      {title:'Это не экзамен',text:'Нет. Прийти к Богу — не экзамен. Бог ждёт не знаний, а доверия: достаточно понять, кто такой Иисус и что Он сделал, и довериться Ему.\n\nОстальное вы узнаете постепенно, всю жизнь.'},
      {title:'Рыбаки',text:'Первые ученики Иисуса были простыми рыбаками. Иисус не сказал им: сначала выучите. Он сказал: идите за Мной.\n\nУчились они уже рядом с Ним.'},
      {title:'Разбойник на кресте',text:'<ev>Рядом с Иисусом распяли разбойника. Он уже ничего не успевал ни выучить, ни исправить. Он только попросил: вспомни меня. Иисус ответил: сегодня же будешь со Мной в раю.</ev>\n\nБог ждёт не знаний, а доверия.'},
      {title:'С чего начать',text:'Узнать главное: вся суть христианства в пяти шагах — в «Евангелии коротко». Понемногу читать Евангелие: там рассказ об Иисусе.\n\nИ говорить с Богом своими словами, как получится. <q>Особых слов не нужно.</q>'}
    ]},
    {slug:'znal-chto-sogreshit',title:'Зачем Бог создал человека, если знал, что тот согрешит?',screens:[
      {title:'Из любви',text:'Бог хотел, чтобы мы были, даже зная, что мы будем грешить.\n\nОн дал человеку настоящий выбор. И с самого начала знал, что Сам придёт и спасёт людей через Иисуса.'},
      {title:'Как родители',text:'<fr>Родители тоже рожают детей, хотя знают: ребёнок будет их обижать, будет ошибаться, будет грешить. Но они всё равно любят этого малыша, поэтому и рожают.</fr>'},
      {title:'Любить можно только свободно',text:'Бог мог бы создать людей, которые просто не умеют делать зло. Но тогда они не умели бы и любить.\n\nЛюбовь — это когда выбираешь сам, а не когда иначе не можешь.'},
      {title:'Он знал цену',text:'Грех людей не застал Бога врасплох. Ещё до того, как создать человека, Он знал: однажды Он Сам станет человеком и умрёт на кресте, чтобы вернуть нас.\n\n<q>И всё равно создал.</q>'},
      {title:'Ради вас',text:'Апостол Пётр писал:\n\n<bq>Он был предопределён ещё до создания мира, но ради вас был явлен в конце времён.</bq>'}
    ]},
    {slug:'nichego-ne-chuvstvuyu',title:'А если я попробую поверить и ничего не почувствую?',screens:[
      {title:'Так бывает часто',text:'Это не значит, что Бога нет или что Он вас не принял.\n\nВера — это доверие Богу, а не особое чувство. Чувства приходят и уходят, а Бог остаётся рядом.'},
      {title:'У всех по-разному',text:'Одни люди, когда приходят к Богу, плачут от радости. Другие не чувствуют ничего особенного.\n\nБог принимает человека, когда тот Ему доверяется, а не когда что-то почувствует.'},
      {title:'Обещание Иисуса',text:'Иисус дал обещание, которое не зависит от настроения:\n\n<bq>Кто придёт ко Мне, того Я никогда не прогоню.</bq>'},
      {title:'Что можно делать',text:'Читать Евангелие — так доверие будет расти. Говорить с Богом честно, в том числе о том, что вы ничего не чувствуете. И быть рядом с другими христианами.\n\nМногие верующие говорят, что <q>поняли, как Бог был рядом, только спустя время.</q>'}
    ]},
    {slug:'zlitsya-na-boga',title:'Можно ли злиться на Бога?',screens:[
      {title:'Можно сказать честно',text:'Да, говорить Богу честно о своей злости можно. Она бывает у многих, особенно в горе.\n\nОн лучше примет честную боль, чем красивые слова, в которые вы сами не верите.'},
      {title:'В Библии на Бога жалуются',text:'Иов, потеряв детей и здоровье, спрашивал, за что ему это. Давид кричал: почему Ты меня оставил? Пророк Иеремия жаловался, что Бог его обманул.\n\nБог не отвернулся ни от одного из них. Эти жалобы даже вошли в Библию.'},
      {title:'Это всё ещё разговор',text:'Когда человек злится на Бога и говорит Ему об этом, он всё ещё разговаривает с Богом.\n\nЭто уже не равнодушие, а отношения, хоть и трудные.'},
      {title:'Не оставаться в злости',text:'Злость можно принести Богу, но жить с ней долго тяжело. Иов в конце встретился с Богом и успокоился, хотя не получил ответа на все вопросы.\n\n<q>Понимание может прийти не сразу, но покой в сердце Бог может дать уже сейчас.</q>'}
    ]},
    {slug:'zachem-poklonenie',title:'Зачем Богу, чтобы Ему поклонялись?',screens:[
      {title:'Это нужно нам',text:'Богу наше поклонение не нужно — у Него и так всё есть. Оно нужно нам.\n\nКогда мы благодарим Бога и доверяем Ему, мы живём так, как задуманы.'},
      {title:'Бог не тщеславен',text:'Бог не стал бы меньше, если бы никто Его не прославлял. Он Сам даёт всем жизнь и всё необходимое.\n\nИ Он не похож на гордого правителя, который любит лесть. Иисус — Сам Бог — мыл ученикам ноги и отдал за людей жизнь.'},
      {title:'Не только песни',text:'Поклонение — это не только песни в церкви.\n\nПоклоняться Богу — значит ставить Его на первое место: любить, благодарить, слушаться и доверять Ему.'},
      {title:'Кто не подведёт',text:'Человек всегда чему-то поклоняется: деньгам, успеху, другому человеку, себе. И всё это рано или поздно подводит.\n\n<q>Бог — единственный, Кто этого достоин и Кто не подведёт.</q>Поэтому Он и зовёт людей к Себе.'}
    ]},
    {slug:'hula-na-duha',title:'Что такое хула на Святого Духа?',screens:[
      {title:'Не случайное слово',text:'Хула на Святого Духа — это не случайное плохое слово и не одна ошибка.\n\nЭто когда человек ясно видит, что действует Бог, и всё равно упорно называет это злом и отвергает Бога до конца.'},
      {title:'Откуда эти слова',text:'<ev>Иисус исцелял людей и освобождал их от злых духов. Все видели, что это добро. Но религиозные учителя, которые Его ненавидели, сказали: Он делает это силой дьявола.</ev>\n\nТогда Иисус и сказал, что Бог прощает любые грехи, кроме хулы на Святого Духа.'},
      {title:'Почему не прощается',text:'Святой Дух помогает человеку увидеть свой грех и прийти к Богу. Кто сознательно и до конца отвергает Его, сам закрывает себе дорогу к прощению.\n\nБог не отказывается прощать. Это человек не хочет, чтобы его простили.'},
      {title:'Если вам страшно',text:'Этот страх — хороший знак. Тот, кто сказал Богу окончательное «нет», уже не переживает, простит ли его Бог.\n\n<q>Если вы хотите, чтобы Бог вас простил, дорога к Нему для вас открыта.</q>'}
    ]},
    {slug:'dumat-o-plohom',title:'Грех ли просто думать о плохом?',screens:[
      {title:'Мысль — ещё не грех',text:'Если плохая мысль просто пришла в голову — это ещё не грех.\n\nГрех начинается, когда человек держится за неё, наслаждается ею и мысленно её «проживает».'},
      {title:'Даже Иисуса искушали',text:'Плохие мысли приходят к каждому. Даже Иисуса искушали, но Он не согрешил.\n\nИскушение — это не грех. Важно, что человек делает с ним дальше.'},
      {title:'Всё начинается в сердце',text:'Иисус говорил: кто долго злится на человека, уже нарушил заповедь «не убивай». А кто смотрит на чужую жену или мужа с желанием, уже изменил в сердце.\n\nБогу важны не только поступки, но и то, что происходит у нас внутри.'},
      {title:'Что с этим делать',text:'Не пугаться: плохая мысль не делает вас «пропащим». Не задерживаться на ней: переключиться и сказать Богу «помоги мне».\n\nА если зашли далеко, попросить прощения. <q>Бог прощает и грехи мыслей.</q>'}
    ]},
    {slug:'iuda',title:'Почему Иуда предал Иисуса?',screens:[
      {title:'Тридцать монет',text:'Иуда любил деньги и поддался злу. Он продал Иисуса за тридцать серебряных монет.\n\nПотом он пожалел, но не вернулся к Богу. И это стало его трагедией.'},
      {title:'Один из двенадцати',text:'Иуда три года ходил с Иисусом, видел Его чудеса и слушал Его. Ему даже доверили общие деньги.\n\nНо Евангелие говорит, что Иуда был вором и брал из этих денег. А потом сам пошёл и продал Иисуса.'},
      {title:'Может, разочаровался?',text:'Некоторые думают, что Иуда ждал, что Иисус станет царём и выгонит римлян. А Иисус говорил о кресте.\n\nНо это лишь догадка. Библия называет другое: любовь к деньгам и зло, которое Иуда впустил в сердце.'},
      {title:'Иуда и Пётр',text:'Иуда пожалел о сделанном и вернул деньги. Но вместо того чтобы прийти к Богу за прощением, он покончил с собой.\n\nА в ночь, когда Иисуса арестовали, Пётр трижды отрёкся от Него. Но Пётр вернулся, и Иисус его простил. <q>Разница не в том, чей грех был меньше, а в том, кто вернулся.</q>'}
    ]},
    {slug:'iisus-12-30',title:'Где был Иисус с 12 до 30 лет?',screens:[
      {title:'Дома, в Назарете',text:'Иисус жил дома, в Назарете. Он слушался родителей, рос и работал плотником.\n\nИстории о том, что Он ездил в Индию или Тибет, придумали в конце XIX — начале XX века. Доказательств у них нет.'},
      {title:'Мальчик в храме',text:'<ev>Когда Иисусу было 12 лет, Он остался в храме и беседовал с учителями.</ev>\n\nПосле этого Евангелие говорит коротко: Он вернулся с родителями в Назарет, слушался их и рос, становясь мудрее.'},
      {title:'Тот самый плотник',text:'Иосиф был плотником, и Иисус работал так же. Когда Он начал проповедовать, люди в Назарете удивлялись: разве это не тот плотник, которого мы все знаем?\n\nЗначит, все эти годы Иисус был у них на глазах.'},
      {title:'Почему так мало написано',text:'В эти годы не происходило ничего необычного. Иисус работал, помогал семье, ходил в синагогу.\n\n<q>Он жил как обычный человек.</q> А Евангелия рассказывают о главном: как Иисус учил, умер и воскрес.'}
    ]},
    {slug:'izbrannyy-narod',title:'Почему именно евреи — избранный народ?',screens:[
      {title:'Не за заслуги',text:'Бог выбрал Авраама и его потомков не за заслуги. Библия прямо говорит: не за то, что они были многочисленнее или лучше других.\n\nБог выбрал их просто потому, что любил их.'},
      {title:'Избран — значит, есть задача',text:'Бог сказал Аврааму, что через него получат благословение все народы земли.\n\nНарод Израиля должен был хранить слово Бога и показывать миру, какой Он.'},
      {title:'Библия и Иисус',text:'Почти все книги Библии написали евреи. И Иисус родился евреем, как и Его ученики.\n\nТак через один народ Бог принёс благо всему миру.'},
      {title:'А что сейчас?',text:'Апостол Павел писал: во Христе нет разницы между евреем и не евреем. <q>Все одинаково дороги Богу.</q>\n\nПри этом Бог не разлюбил еврейский народ. И христианство не даёт никакого права относиться к евреям плохо.'}
    ]},
    {slug:'noev-kovcheg',title:'Ноев ковчег и потоп — это правда было?',screens:[
      {title:'Это было',text:'Христиане верят, что потоп был на самом деле. Иисус говорил о Ное как о реальном человеке.\n\nРассказы о великом потопе есть и у многих древних народов.'},
      {title:'Что произошло',text:'<ev>Люди на земле стали очень злыми. Бог решил остановить зло потопом, но спас праведного Ноя, его семью и животных. Для этого Ной построил огромный корабль — ковчег.</ev>'},
      {title:'Почему христиане верят',text:'Иисус сравнивал Своё возвращение с днями Ноя, когда люди жили беспечно, пока не пришёл потоп.\n\nО потопе помнят древние шумеры, вавилоняне и другие народы. А ковчег длиной около 135 метров по пропорциям подходит для устойчивого корабля.'},
      {title:'Вся Земля?',text:'Христиане по-разному понимают масштаб потопа.\n\nОдни считают, что вода покрыла всю планету. Другие — весь мир, известный людям того времени.'},
      {title:'Радуга',text:'Эта история показывает две вещи: Бог не оставляет зло безнаказанным, но всегда даёт путь к спасению.\n\nПосле потопа Бог пообещал больше никогда не губить землю водой. <q>Знаком этого обещания стала радуга.</q>'}
    ]},
    {slug:'vozrast-zemli',title:'Сколько лет Земле по Библии и где там динозавры?',screens:[
      {title:'Возраст не назван',text:'Библия не называет возраст Земли. Христиане здесь расходятся: одни считают, что Земле несколько тысяч лет, другие согласны с учёными, что Земле около 4,5 миллиарда лет.'},
      {title:'Шесть дней',text:'В начале Библии сказано, что Бог создал мир за шесть дней. Одни понимают эти дни как обычные и, складывая годы из библейских родословий, получают 6–10 тысяч лет.\n\nДругие считают, что «день» здесь — долгий период. Ведь Библия говорит, что у Бога тысяча лет — как один день.'},
      {title:'А динозавры?',text:'Динозавров Библия не упоминает. Она не перечисляет всех животных, которые когда-либо жили: Библия рассказывает о Боге и людях, а не о древних животных.\n\nНо динозавры — тоже часть творения Бога.'},
      {title:'В главном согласны',text:'Спор идёт о том, как Бог творил.\n\nА в главном христиане согласны: <q>мир не появился случайно, его создал Бог.</q>'}
    ]},
    {slug:'bes',title:'Может ли в человека вселиться бес?',screens:[
      {title:'Иисус сильнее',text:'Да, Библия говорит, что такое бывает: злые духи существуют и могут сильно мучить человека. Но Иисус сильнее их.\n\nВ человека, который принадлежит Иисусу, бес вселиться не может.'},
      {title:'Духи Его слушались',text:'В Евангелиях много раз рассказывается, как Иисус встречал людей, которых мучили злые духи. Он одним словом освобождал этих людей.\n\nИисус говорил о бесах как о настоящих злых существах, а не просто как о болезни.'},
      {title:'Бояться не нужно',text:'В том, кто доверился Иисусу, живёт Святой Дух. Там, где Бог, злой дух не может стать хозяином.\n\n<bq>Тот, Кто в вас, больше того, кто в мире.</bq>'},
      {title:'Важно знать',text:'Не всё странное — от бесов: многие тяжёлые состояния — это болезни. А с оккультным не играйте: гадания и «вызов духов» открывают дверь злу.\n\n<q>Защита — не амулеты и обряды, а доверие Иисусу и молитва.</q>'}
    ]},
    {slug:'angel-hranitel',title:'Есть ли у меня ангел-хранитель?',screens:[
      {title:'Бог заботится Сам',text:'Бог посылает ангелов защищать людей, и вас тоже. Есть ли у каждого свой личный ангел, Библия прямо не говорит.\n\nНо точно ясно: Бог заботится о вас Сам.'},
      {title:'Кто такие ангелы',text:'Ангелы — духовные существа, которых создал Бог. Они служат Ему и помогают людям: выводят из беды, предупреждают об опасности, приносят вести от Бога.\n\n<bq>Он Своим ангелам повелит о тебе — охранять тебя на всех твоих путях.</bq>'},
      {title:'А личный ангел?',text:'Иисус однажды сказал про детей, что их ангелы всегда перед Богом. Поэтому православные и католики верят, что у каждого есть свой ангел-хранитель.\n\nПротестанты говорят осторожнее: Бог посылает ангелов, когда нужно, но утверждать, что у каждого есть «свой», Библия не позволяет.'},
      {title:'Главное',text:'Мы, протестанты, молимся не ангелам, а Богу. Ангелы — Его слуги.\n\n<q>Говорить можно прямо с Богом: Он слышит.</q>'}
    ]},
    {slug:'antihrist',title:'Кто такой антихрист и что значит 666?',screens:[
      {title:'Противник Христа',text:'Антихрист — это противник Христа. Библия говорит, что перед возвращением Иисуса появится человек, который будет обманывать людей и бороться с Богом.\n\nНо Иисус победит, и бояться христианам не нужно.'},
      {title:'Кто он',text:'Апостол Иоанн писал, что противников Христа много уже сейчас: это все, кто отвергает, что Иисус — Христос и Сын Божий.\n\nНо в конце времён придёт главный противник. Он будет выдавать себя за Бога, творить ложные чудеса и требовать, чтобы ему поклонялись.'},
      {title:'Число 666',text:'В книге Откровение есть число 666 — число «зверя». Многие христиане думают, что так назван этот противник. Что значит само число, понимают по-разному.\n\nМногие учёные думают, что для первых читателей это был намёк на жестокого римского императора Нерона, который преследовал христиан.'},
      {title:'Штрихкоды ни при чём',text:'Штрихкоды, ИНН и номера паспортов к этому отношения не имеют. Случайно «принять число зверя» нельзя. Это делает только тот, кто сам отрекается от Бога.\n\nБиблия говорит ясно: антихрист продержится недолго. Иисус вернётся и победит его. <q>Последнее слово — за Иисусом.</q>'}
    ]},
    {slug:'zhivotnye-v-rayu',title:'Попадут ли животные в рай?',screens:[
      {title:'Животные там будут',text:'Библия прямо об этом не говорит. Но она обещает, что на новой земле, которую создаст Бог, будут животные.\n\nПопадёт ли туда именно ваш питомец, мы не знаем. Зато знаем: Бог добр ко всему, что создал.'},
      {title:'Бог любит животных',text:'Бог создал животных и назвал их хорошими. Иисус говорил, что даже маленькая птица не упадёт на землю без воли вашего Небесного Отца.\n\nБог видит каждое живое существо.'},
      {title:'Волк и ягнёнок',text:'В конце Бог не уничтожит мир, а обновит его. Пророк Исаия описывает этот мир так: волк будет жить рядом с ягнёнком, а лев будет есть солому, как вол.\n\nЗначит, животные там будут, и больше не станут вредить друг другу.'},
      {title:'А мой питомец?',text:'Если вы скучаете по любимому животному, можно доверить это Богу.\n\n<q>Он добрее, чем мы можем представить.</q>'}
    ]},
    {slug:'molitva-za-umershih',title:'Можно ли молиться за умерших?',screens:[
      {title:'По-разному',text:'Мы, протестанты, не молимся за умерших: мы верим, что судьба человека решается при жизни. Православные и католики молятся, потому что верят, что это может помочь умершему.\n\nНо молиться Богу о своём горе и благодарить Его за близкого человека можно всегда.'},
      {title:'Почему мы так думаем',text:'Библия говорит, что человеку положено однажды умереть, а потом будет суд.\n\n<pr>Иисус рассказывал о богаче и нищем Лазаре. После смерти их судьбу уже нельзя было изменить.</pr>\n\nА судьбу каждого человека мы доверяем Богу: Он справедливее и милостивее нас.'},
      {title:'Когда умер близкий',text:'Можно благодарить Бога за этого человека и за всё хорошее, что было. Говорить Богу о своей боли — Он утешает тех, кто плачет.\n\nИ молиться за живых: за родных, которым сейчас тоже тяжело.'},
      {title:'Надежда',text:'Для тех, кто верит в Иисуса, смерть — не конец.\n\n<q>Бог воскресит умерших, и мы снова встретимся.</q>'}
    ]},
    {slug:'kreshchen-v-detstve',title:'Я крещёный в детстве — значит, я уже христианин?',screens:[
      {title:'Решали родители',text:'Само по себе — нет. Крестить ребёнка решают родители.\n\nА христианином человека делает его собственная вера: когда он сам доверился Иисусу.'},
      {title:'Родиться заново',text:'<ev>Однажды ночью к Иисусу пришёл Никодим. Он был известным учителем и строго соблюдал все обряды. Иисус сказал ему: чтобы увидеть Царство Божье, человек должен родиться заново.</ev>\n\nНикодим удивился: как взрослый может родиться снова? Иисус объяснил: речь о новой жизни, которую даёт Бог.'},
      {title:'Решает каждый сам',text:'Новую жизнь от Бога не заменит даже самая религиозная жизнь. Принять её каждый решает сам. Особых слов не нужно: можно своими словами сказать Богу, что вы хотите жить с Ним.\n\nНужно ли креститься ещё раз — церкви отвечают по-разному. Православные и католики второй раз не крестят, а в евангельских церквях обычно крестят тех, кто сам поверил.'},
      {title:'Ваш выбор',text:'Ваши родители хотели, чтобы вы были с Богом.\n\n<q>Теперь этот выбор можете сделать вы сами.</q>'}
    ]},
    {slug:'krestik',title:'Нужно ли носить крестик?',screens:[
      {title:'Не обязательно',text:'В Библии о крестике ничего не сказано. Его можно носить как знак своей веры.\n\nНо крестик не оберег: он не защищает и не делает человека христианином.'},
      {title:'Как относятся церкви',text:'В православной традиции крестик надевают при крещении и носят всю жизнь.\n\nУ протестантов такого правила нет: кто-то носит крестик, кто-то нет.'},
      {title:'Главное — не на шее',text:'<bq>Человек смотрит на внешний вид, а Господь смотрит на сердце.</bq>\n\nБог видит, доверяет ли человек Ему, а не что на нём надето.'},
      {title:'А если я не верю?',text:'Запрета в Библии нет. Но крестик — знак того, что человек идёт за Иисусом. Если носить его просто на удачу, он превращается в талисман.\n\n<q>Важен не крестик, а Тот, Кто был распят.</q>'}
    ]},

  }
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  // шапка и низ слайда: номер, подпись («Миф 2 из 7», «Шаг 3 из 5»), заголовок, точки
  // шапка и низ слайда: подпись («Миф 2 из 7», «Шаг 3 из 5», «2 из 4»), заголовок, точки
  function frame(sc){
    var n=idx+1,t=cur.screens.length,d='',o=typeof sc==='string'?{}:sc;
    var word=o.kind==='myth'?'Миф':o.kind==='step'?'Шаг':'';
    // подпись только там, где номер что-то значит: «Миф 3 из 7», «Шаг 3 из 5»
    var top=word?'<div class="mh"><span class="vlab">'+word+' '+n+' из '+t+'</span></div>':'';
    for(var i=1;i<=t;i++)d+='<button type="button" data-go="'+(i-1)+'" aria-label="Слайд '+i+' из '+t+'"'+(i===n?' aria-current="step"':'')+'><i class="'+(i===n?'on':i<n?'past':'')+'"></i></button>';
    slideHead.innerHTML=top+
      (o.title?'<p class="stitle">'+esc(o.title)+'</p>':'')+(o.kind==='myth'?'<div class="truth">На самом деле</div>':'');
    slideFoot.innerHTML='<div class="mdots">'+d+'</div>';
    slideHead.hidden=slideFoot.hidden=false;stage.classList.add('framed');
  }
  function prevStory(){var g=group(cur),i=g.indexOf(cur);return i>0?g[i-1]:null}
  // откуда открыли текущую историю: со страницы сайта, из списка «Все истории» или кнопкой «Следующая история»
  var entry='page';
  // уйти из сторис туда, откуда пришли (или на главную)
  document.querySelector('.close').addEventListener('click',function(e){e.preventDefault();leave()}); /* ✕ — туда, откуда пришли */
  /* ссылки из сторис на страницы сайта продолжают путь человека по сайту */
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(a&&!a.classList.contains('close')&&!/^(#|https?:)/.test(a.getAttribute('href')))try{sessionStorage.setItem('pv-nav','1')}catch(_){}});
  function leave(){
    /* пришли со страницы сайта — делаем настоящий шаг назад по истории браузера,
       иначе страница откроется заново и стрелка «назад» в браузере будет возвращать в сторис */
    var r=document.referrer,ref=null;
    try{if(r&&new URL(r).origin===location.origin&&!/\/stories(\.html)?$/.test(new URL(r).pathname))ref=r}catch(e){}
    if(ref&&history.length>1){try{sessionStorage.setItem('pv-back',String(Date.now()))}catch(e){}history.back();return}
    /* страница сайта, с которой открыли сторис (её запомнил site.js); вернёмся на то же место */
    var t=null;try{t=JSON.parse(sessionStorage.getItem('pv-trail'))}catch(e){}
    if(t&&t.length){try{sessionStorage.setItem('pv-back',String(Date.now()))}catch(e){}location.href=t[t.length-1].p;return}
    location.href=ref||'home.html';
  }
  function canBack(){
    if(mode==='all')return !!allFrom;
    if(mode==='end')return true;
    return idx>0||(entry==='next'&&!!prevStory());
  }
  // кнопка «Назад» всегда рабочая: если внутри сторис идти некуда, она возвращает на сайт
  function updBack(){backBtn.disabled=false}
  // Назад: предыдущий слайд; с первого слайда — последний слайд прошлой истории;
  // с экрана «Что дальше?» — последний слайд; со списка «Все истории» — туда, откуда пришли.
  function back(){
    stopTyping();
    if(!canBack()){if(mode!=='all'&&entry==='all'){showAll();return}leave();return}
    if(mode==='all'){
      if(!allFrom)return;
      var f=allFrom;allFrom=null;cur=BY[f.slug];bars.innerHTML='';
      if(f.mode==='end')showEnd();else{idx=f.idx;showScreen(true)}
      return;
    }
    if(mode==='end'){idx=cur.screens.length-1;showScreen(true);return}
    if(idx>0){idx--;showScreen(true);return}
    var p=prevStory();
    if(p){cur=p;idx=cur.screens.length-1;bars.innerHTML='';try{history.replaceState(null,'','#'+cur.slug)}catch(e){}showScreen(true)}
  }
  function next(){
    if(typing){showDone();return}
    firstHint=false;
    if(idx<cur.screens.length-1){idx++;showScreen()}
    else{done[cur.slug]=true;save();showEnd()}
  }
  // касание левой части экрана листает только внутри сторис и никуда не уводит
  function prev(){if(canBack())back()}

  function card(s,lab){
    return '<button type="button" class="card'+(done[s.slug]?' done':'')+'" data-k="'+s.slug+'"><small>'+lab+'</small><b>'+s.title+'</b>'+(done[s.slug]?'<span>✓ просмотрено</span>':'')+'<i class="go" aria-hidden="true">→</i></button>';
  }
  function bind(){
    choice.querySelectorAll('.card').forEach(function(b){b.addEventListener('click',function(){start(b.dataset.k,mode==='all'?'all':'next')})});
    var a=$('allBtn');if(a)a.addEventListener('click',showAll);
    var g=$('againBtn');if(g)g.addEventListener('click',function(){start(cur.slug,entry)});
  }
  function showEnd(){
    stopTyping();stage.hidden=true;choice.hidden=false;
    mode='end';idx=total()-1;setProgress();updBack();
    var g=group(cur),nx=cur.slug==='gospel'?BY['kto-takoy-iisus']:g[g.indexOf(cur)+1]; /* после Евангелия — сразу первый урок */
    var h='<h2>'+(nx?'Что дальше?':'Все истории пройдены')+'</h2><div class="cards">';
    if(nx)h+=card(nx,'Следующая история · '+label(nx));
    h+='</div><a class="read" href="'+cur.slug+'.html">Читать '+noun(cur)+' «'+cur.title+'» полностью</a>';
    h+='<button type="button" class="restart" id="againBtn">Посмотреть ещё раз</button>';
    h+='<button type="button" class="restart" id="allBtn">Все истории</button>';
    choice.innerHTML=h;bind();
  }
  function showAll(){
    if(mode!=='all')allFrom={slug:cur.slug,idx:idx,mode:mode};
    stopTyping();stage.hidden=true;choice.hidden=false;mode='all';updBack();
    var h='<h2>Все истории</h2><p class="sub">По одной на каждый урок, вопрос и статью. Можно смотреть по порядку или выбрать любую.</p>';
    PARTS.forEach(function(p,pi){
      h+='<div class="part-h">'+(pi+1)+'. '+p+'</div><div class="cards">';
      L.forEach(function(s){if(s.part===pi)h+=card(s,'Урок '+s.n)});
      h+='</div>';
    });
    [['Вопросы',Q],['Статьи',A]].forEach(function(gr){
      h+='<div class="part-h">'+gr[0]+'</div><div class="cards">';
      gr[1].forEach(function(s){h+=card(s,label(s))});
      h+='</div>';
    });
    choice.innerHTML=h;choice.scrollTop=0;bind();
  }

  function start(slug,from){entry=from||'page';allFrom=null;cur=BY[slug]||L[0];idx=0;bars.innerHTML='';try{history.replaceState(null,'','#'+cur.slug)}catch(e){}showScreen()}

  stage.addEventListener('click',function(e){
    // точки внизу слайда: сразу к нужному слайду
    var b=e.target.closest&&e.target.closest('[data-go]');
    if(b){firstHint=false;idx=+b.dataset.go;showScreen(idx>0);return}
    var r=stage.getBoundingClientRect();
    if(e.clientX-r.left<r.width*.3)prev();else next();
  });
  backBtn.addEventListener('click',back);
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'&&canBack()){e.preventDefault();back();return}
    if(!choice.hidden)return;
    if((e.key===' '||e.key==='Enter')&&e.target.closest&&e.target.closest('[data-go]'))return; /* точка в фокусе — пусть сработает она */
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();next()}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  });
  $('topicsBtn').addEventListener('click',showAll);
  window.addEventListener('hashchange',function(){var k=location.hash.slice(1);if(BY[k]&&k!==cur.slug)start(k)});

  start(location.hash.slice(1));
})();
</script>
